#####
# Legacy last-backup sensors — `find` the newest file under
# `/media/pi_backups/...` on the share.
#
# These are NOT the source of truth any more. Duplicati jobs already
# expose Date + Status on each device; `sensor.duplicati_backup_health`
# and `dashboards/cards/backup-glance.yaml` track those. Add a Duplicati
# job for a service; do not add another find here.
#
# Still referenced from Hosts control rows and the Pi graph folds
# (`home_assistant_details` / `pi_details`). Leave the sensors until
# those jobs exist in Duplicati, then delete this file.
#
# Path caveats (do not "fix" without checking the share):
#   homeassistant-backup   HA copies — may still be valid
#   pihole-backup          Pi-hole copies — may still be valid
#   deluge-backup          old rpi1 / poat-seedbox tree. TODO.md says
#                          do not retarget at jack-sparrow without
#                          checking the path exists. Likely stale.
#   plex-backup/MediaServer  same class of leftover. Confirm before
#                          trusting the date.
#####

- sensor:
    name: Home Assistant Last Backup
    unique_id: a04f4c5f-d599-4b4d-885f-b691ca6b0087
    command: 'date -d "@$(find /media/pi_backups/homeassistant-backup -type f -print0 | xargs -0 stat -c %Y | sort | tail -n 1)" "+%Y-%m-%dT%H:%M:%S%z"'
    value_template: "{{ as_timestamp(value, 0) | timestamp_custom('%b %d %H:%M')  }}"

