#####
# Alert for cat devices.
#
#####

cats:
  name: Cat device issue
  entity_id: binary_sensor.cat_device_status
  title: 🐱 Cat device problem!

  # todo - get sensors more dynamically - expand group?
  message: >
    {% macro check_entity(entity_id) %}
      {% if state_attr(entity_id, 'entity_id') is not none %}
        {# This is a group - recursively expand it #}
        {% for member in state_attr(entity_id, 'entity_id') %}
          {{ check_entity(member) }}
        {% endfor %}
      {% elif states(entity_id) == "on" %}
        {# Add the entity's friendly name to the list if it's "on" #}
        {% set ns.issues = ns.issues + [(entity_id, state_attr(entity_id, 'friendly_name')|default(entity_id.split('.')[-1]|replace('_', ' ')|title))] %}
      {% endif %}
    {% endmacro %}

    {% set ns = namespace(issues = []) %}

    {# Start the recursive check with the main group #}
    {{ check_entity('binary_sensor.cat_device_status') }}

    {% if ns.issues|length > 0 %}
      These are the cat device issues - fix them!
      {% for entity_id, issue in ns.issues %}
      • {{ issue }} - {{ states[entity_id].state }}{% if state_attr(entity_id, 'description') %} ({{ state_attr(entity_id, 'description') }}){% endif %}
      {% endfor %}
    {% else %}
      All cat devices are functioning properly.
    {% endif %}

  done_message: clear_notification
  state: 'on'
  repeat: 120
  data:
    tag: cat_issue
    prompt: cat's feeder has an issue
    backup: Cat feeders have a prob..
  notifiers:
    - family
