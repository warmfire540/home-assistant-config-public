#####
# Alert for washer cleaning (sensor.washy_cycles resets after clean).
#
#####

clean_washy:
  name: Clean Washer
  entity_id: binary_sensor.washy_needs_cleaned
  title: 🧼 Clean Washer!
  message: false
  done_message: clear_notification
  state: 'on'
  repeat: 300
  data:
    tag: clean_washy
    prompt: clean the washing machine
    backup: Clean the washer!
  notifiers:
    - family_ai
