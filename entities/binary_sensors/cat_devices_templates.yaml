#####
# Cat Devices - Binary Sensors
# Created Binary Sensors out of device attributes
#####

platform: template
sensors:
  cat_noms_status_problem:
    friendly_name: 'Cat Noms Status Problem'
    value_template: "{{ not is_state('sensor.cat_noms_device_status', 'Online') }}"
    unique_id: 136f0df9-aa84-4978-a293-56af9e85a667
    device_class: problem
    icon_template: >
      mdi:power-plug{{'-off' if not is_state('sensor.cat_noms_device_status','Online')}}

  cat_noms_battery_problem:
    friendly_name: 'Cat Noms Battery Problem'
    value_template: "{{ states('binary_sensor.cat_noms_battery_installed') not in ['on'] }}"
    unique_id: d2734d50-f3a4-4aa6-84cc-87e8bb1ab28a
    device_class: problem
    icon_template: >
      mdi:battery{{'-alert-variant' if states('sensor.cat_noms_battery_installed') not in ['on']}}

  cat_noms_desicant_problem:
    friendly_name: 'Cat Noms Desicant Problem'
    value_template: "{{ is_state('sensor.cat_noms_desiccant_left_days', '0') }}"
    unique_id: ac8a5b14-08c3-4cd5-a754-403aa3f22b44
    device_class: problem
    icon_template: mdi:air-filter

  wild_trail_cam_status_problem:
    friendly_name: 'Wild Trail Cam Status Problem'
    value_template: "{{ not is_state('sensor.wild_trail_cam_device_status', 'Online') }}"
    unique_id: a7223d04-f6f5-4219-93bf-cc108f73d005
    device_class: problem
    icon_template: >
      mdi:power-plug{{'-off' if not is_state('sensor.wild_trail_cam_device_status','Online')}}
      
  wild_trail_cam_desicant_problem:
    friendly_name: 'Wild Trail Cam Desicant Problem'
    value_template: "{{ is_state('sensor.wild_trail_cam_desiccant_left_days', '0') }}"
    unique_id: dffcdd2a-0a24-45a0-81d9-7a2e833073a7
    device_class: problem
    icon_template: mdi:air-filter
