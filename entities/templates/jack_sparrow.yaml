---
#####
# jack-sparrow (UGREEN NASync DXP4800 Pro) — derived sensors
#
# The ugreen integration exposes used/total as formatted strings ("1.2 TB")
# plus matching `*_raw` sensors in bytes. It does NOT expose a used percentage,
# which is the number you actually want on a summary card and the only sane
# thing to threshold an alert against.
#
# Volume 1 on pool 1 = the RAID 5 bulk array (32.6 TiB).
# Volume 1 on pool 2 = the RAID 1 NVMe app/VM pool (1.8 TiB).
#
# Consumed by:
#   - ui_lovelace_minimalist/dashboard/views/01-home.yaml (NAS summary card)
#   - dashboards/jack-sparrow.yaml (standalone dashboard)
#####

- sensor:
    #################
    # VOLUME USED %
    #################
    - name: jack-sparrow Pool 1 Volume 1 Used
      unique_id: 777b3b55-f859-4542-a373-320195e0b9e1
      icon: 'mdi:harddisk'
      unit_of_measurement: '%'
      state_class: measurement
      availability: >
        {{ states('sensor.jack_sparrow_pool_1_volume_1_total_size_raw')
           | float(0) > 0 }}
      state: >
        {{ (states('sensor.jack_sparrow_pool_1_volume_1_used_size_raw') | float(0)
            / states('sensor.jack_sparrow_pool_1_volume_1_total_size_raw') | float(1)
            * 100) | round(1) }}
      attributes:
        used: "{{ states('sensor.jack_sparrow_pool_1_volume_1_used_size') }}"
        available: "{{ states('sensor.jack_sparrow_pool_1_volume_1_available_size') }}"
        pool: 'Pool 1 — RAID 5, 4x 12TB'

    - name: jack-sparrow Pool 2 Volume 1 Used
      unique_id: 303275c6-8893-4479-a952-506c431b6c4c
      icon: 'mdi:chip'
      unit_of_measurement: '%'
      state_class: measurement
      availability: >
        {{ states('sensor.jack_sparrow_pool_2_volume_1_total_size_raw')
           | float(0) > 0 }}
      state: >
        {{ (states('sensor.jack_sparrow_pool_2_volume_1_used_size_raw') | float(0)
            / states('sensor.jack_sparrow_pool_2_volume_1_total_size_raw') | float(1)
            * 100) | round(1) }}
      attributes:
        used: "{{ states('sensor.jack_sparrow_pool_2_volume_1_used_size') }}"
        available: "{{ states('sensor.jack_sparrow_pool_2_volume_1_available_size') }}"
        pool: 'Pool 2 — RAID 1, 2x 2TB NVMe'

    #################
    # ROLLED-UP HEALTH
    #################
    # One entity to alert on / colour the home card with, instead of watching
    # eleven separate status sensors. Any pool, volume or disk not reporting
    # "Normal" makes this Problem, and lists what is wrong in an attribute.
    #
    # The watched-entity list is built by pattern rather than hardcoded so it
    # cannot drift between `state` and `problems`, and so adding a disk or pool
    # in UGOS is picked up without editing this file. Matches:
    #   sensor.jack_sparrow_pool_N_status
    #   sensor.jack_sparrow_pool_N_disk_N_status
    #   sensor.jack_sparrow_pool_N_volume_N_status
    - name: jack-sparrow Health
      unique_id: 2d4a6b22-a261-43d3-80c8-e18d2e7d9e73
      # `this` = this entity's own state object. Avoids a self-referencing
      # state_attr() call, which would deadlock the template.
      icon: "{{ 'mdi:nas' if this.state == 'OK' else 'mdi:alert' }}"
      state: >
        {{ 'Problem' if states.sensor
             | selectattr('entity_id', 'search',
                          '^sensor\.jack_sparrow_pool_\d+(_(disk|volume)_\d+)?_status$')
             | rejectattr('state', 'in', ['Normal', 'unknown', 'unavailable'])
             | list | count > 0 else 'OK' }}
      attributes:
        # Human-readable so it can be dropped straight into a notification or
        # more-info dialog: "Pool 1 Disk 3: Degraded, Pool 2: Warning".
        problems: >
          {% set ns = namespace(bad=[]) %}
          {% for s in states.sensor
               | selectattr('entity_id', 'search',
                            '^sensor\.jack_sparrow_pool_\d+(_(disk|volume)_\d+)?_status$')
               | rejectattr('state', 'in', ['Normal', 'unknown', 'unavailable']) %}
            {% set label = s.name
                 | replace('jack-sparrow ', '') | replace(' Status', '') %}
            {% set ns.bad = ns.bad + [label ~ ': ' ~ s.state] %}
          {% endfor %}
          {{ ns.bad | join(', ') }}
        problem_count: >
          {{ states.sensor
             | selectattr('entity_id', 'search',
                          '^sensor\.jack_sparrow_pool_\d+(_(disk|volume)_\d+)?_status$')
             | rejectattr('state', 'in', ['Normal', 'unknown', 'unavailable'])
             | list | count }}
