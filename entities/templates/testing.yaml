---
#####
# Fixed-state helper entities for automations and conditions.
# Always-on/off values that never change — useful as placeholders in
# choose blocks, alert filters, and other logic that needs a constant.
#
# Device-card testing: these cannot join a device from YAML. MQTT mirrors
# on "Device Card Test" are driven from them — see
# integrations/mqtt_testing_device.yaml and
# automations/mqtt/sync_testing_device.yaml.
#
#####

- binary_sensor:
    - name: Test Always On
      unique_id: a1b2c3d4-e5f6-7890-abcd-ef1234567801
      state: "{{ true }}"
      icon: mdi:toggle-switch

    - name: Test Always Off
      unique_id: a1b2c3d4-e5f6-7890-abcd-ef1234567804
      state: "{{ false }}"
      icon: mdi:toggle-switch-off
