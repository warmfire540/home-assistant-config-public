---
#####
# Certificate expiry — the NPM renewal watchdog
#
# There is no Home Assistant integration for Nginx Proxy Manager. Uptime
# Kuma answers "is NPM up". This file answers "is the wildcard still
# renewing?" Certbot renews inside the NPM container over DNS-01 with no
# interaction, so a stalled renewal produces no signal until every service
# goes red at once, roughly 60 days after a Cloudflare token is revoked or
# a DNS plugin breaks. NPM 2.15.0 warned that DNS plugins "may not work as
# expected" across that upgrade.
#
# HA's core `cert_expiry` integration is the mechanism. Point it at any
# proxied hostname on 443 and it reports the cert NPM is actually serving.
#
# The state is a UTC datetime, not a day count. The frontend renders it as
# "in 47 days"; a numeric comparison against the raw state does not work.
# Convert with `as_datetime()` and subtract `now()`. That conversion is
# done once here so nothing downstream has to remember.
#
# `integration_entities('cert_expiry')` rather than naming
# `sensor.cert_expiry_scrutiny_home_masterscrib_net`. A predicted entity ID
# that matches nothing does not error; it renders healthy forever.
#
# One wildcard, many hosts. Monitoring a single hostname is enough today;
# the `min` below covers whichever expires first if a second cert ever
# exists.
#
# Consumed by:
#   - automations/lab/cert_expiry.yaml
#   - dashboards/lab/views/01-uptime.yaml
#
# Setup: servers repo, hosts/jack-sparrow/npm-runbook.md
# Upstream: https://www.home-assistant.io/integrations/cert_expiry/
#####

- sensor:
    #################
    # DAYS UNTIL THE SOONEST CERTIFICATE EXPIRES
    #################
    # Let's Encrypt issues for 90 days and certbot attempts renewal at 30 days
    # remaining. So this number lives at 60-90 in a healthy lab and only walks
    # below 30 if renewal has actually failed. That is what makes it a good
    # alert signal rather than a countdown you learn to ignore.
    #
    # `device_class: duration` + `state_class: measurement` so the recorder
    # keeps long-term statistics. The sawtooth — down to 30, snap back to 90 —
    # IS the evidence renewal is working. A line that stops resetting is the
    # picture of a broken renewal, visible months before the outage.
    - name: Lab Certificate Expiry
      unique_id: 6d4b21ae-93c7-4f18-8a5c-e02b7f419dd6
      icon: >
        {{ 'mdi:certificate-outline' if this.state | int(999) > 21
           else 'mdi:certificate-off' }}
      unit_of_measurement: d
      device_class: duration
      state_class: measurement
      # Unavailable if the integration is gone, rather than a confident large
      # number derived from an empty list. `min()` also throws on an empty
      # list, so this guard is doing double duty.
      #
      # Entities are filtered on having a PARSEABLE state, not just on
      # existing: cert_expiry reports `unknown` when it cannot reach the host,
      # and `as_datetime('unknown')` returns None, which poisons the min().
      availability: >
        {{ expand(integration_entities('cert_expiry'))
           | rejectattr('state', 'in', ['unknown', 'unavailable'])
           | list | count > 0 }}
      state: >
        {% set ns = namespace(days=[]) %}
        {% for s in expand(integration_entities('cert_expiry'))
             | rejectattr('state', 'in', ['unknown', 'unavailable']) %}
          {% set d = as_datetime(s.state) %}
          {% if d is not none %}
            {% set ns.days = ns.days + [(d - now()).days] %}
          {% endif %}
        {% endfor %}
        {{ ns.days | min if ns.days else None }}
      attributes:
        # Which host, so a low number names the certificate without a trip to
        # the integration page.
        soonest: >
          {% set ns = namespace(name='', days=99999) %}
          {% for s in expand(integration_entities('cert_expiry'))
               | rejectattr('state', 'in', ['unknown', 'unavailable']) %}
            {% set d = as_datetime(s.state) %}
            {% if d is not none and (d - now()).days < ns.days %}
              {% set ns.days = (d - now()).days %}
              {% set ns.name = s.name | replace('Cert Expiry ', '') %}
            {% endif %}
          {% endfor %}
          {{ ns.name if ns.name else 'none reporting' }}
        # ⚠️ A SEPARATE AND MORE URGENT FAILURE THAN THE COUNTDOWN.
        #
        # `is_valid` goes false when the handshake itself fails — expired,
        # self-signed, hostname mismatch, or the host simply not answering on
        # 443. That can happen with 60 days still on the clock, so the numeric
        # alert below would never fire. Checked independently for that reason.
        #
        # The most likely real cause here is not the certificate at all: it is
        # NPM down, or the Pi-hole wildcard gone, either of which breaks the
        # handshake while the cert on disk stays perfectly valid.
        invalid: >
          {% set ns = namespace(bad=[]) %}
          {% for s in expand(integration_entities('cert_expiry')) %}
            {% if s.attributes.is_valid is defined
                  and not s.attributes.is_valid %}
              {% set ns.bad = ns.bad
                   + [(s.name | replace('Cert Expiry ', ''))
                      ~ ': ' ~ (s.attributes.error | default('handshake failed', true))] %}
            {% endif %}
          {% endfor %}
          {{ ns.bad | join(', ') if ns.bad else 'all valid' }}
        invalid_count: >
          {{ expand(integration_entities('cert_expiry'))
             | selectattr('attributes.is_valid', 'defined')
             | rejectattr('attributes.is_valid')
             | list | count }}
        # Sanity check, same role as `monitor_count` on lab_availability and
        # `drive_count` on scrutiny_drive_health: if this drops to zero the
        # watchdog is not watching, and a watchdog that stopped looks exactly
        # like a certificate that is fine.
        cert_count: >
          {{ integration_entities('cert_expiry') | list | count }}
        navigation_path: /home-lab/uptime
