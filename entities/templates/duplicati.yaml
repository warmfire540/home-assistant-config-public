---
#####
# Duplicati — backup job rollups
#
# hass-duplicati (HACS, txxa/hass-duplicati) creates one HA device per
# backup job (`<job name> Backup`) with a fixed entity set: Status / Running
# (binary), Date, Duration, Error message, Next scheduled execution,
# Source/Target files & size, Create Backup / Refresh Sensor Data. Jobs are
# named by the Duplicati job name; there is no serial. Everything below
# reads `integration_entities('duplicati')`, so a second job needs no edit
# here or on the dashboard.
#
# `binary_sensor.*_status` is device_class: problem. On means a problem, off
# means the last backup was clean. Opposite of Scrutiny's health sensor and
# of a naive reading of the entity name. Getting this backwards renders a
# failed backup as green. Verified against upstream
# (const.py METRIC_LAST_STATUS, binary_sensor.py
# device_class=BinarySensorDeviceClass.PROBLEM).
#
# `binary_sensor.*_running` is device_class: running.
#
# Suffixes verified against upstream source 2026-08-15, not yet against the
# live instance. Re-run after any integration upgrade if a card goes empty:
#
#   {{ integration_entities('duplicati') | list }}
#
# Consumed by: dashboards/cards/backup-glance.yaml (Uptime / Backups /
# Hosts) and dashboards/lab/views/02-backups.yaml (job detail cards).
# Upstream: https://github.com/txxa/hass-duplicati
#####

- sensor:
    #################
    # ROLLED-UP BACKUP HEALTH
    #################
    # One verdict across every job. A problem is "the last run for some job
    # ended in error" OR "some job has gone stale" — the second because a
    # backup that silently stopped scheduling looks identical to a healthy one
    # here otherwise. Staleness itself is judged by comparing each job's own
    # `next_scheduled_execution` to now, so a job on a weekly schedule is not
    # flagged for being quiet on a Tuesday.
    - name: Duplicati Backup Health
      unique_id: 6e9b1a3a-9f5b-4b0e-9a1a-8a2e6b8b8b0e
      icon: "{{ 'mdi:shield-check' if this.state == 'OK' else 'mdi:shield-alert' }}"
      # Unavailable if the integration is gone or every job is unreachable —
      # matches the guard pattern in scrutiny.yaml: existing is not the same
      # as reporting.
      availability: >
        {{ expand(integration_entities('duplicati'))
           | selectattr('entity_id', 'search', '_status$')
           | selectattr('entity_id', 'search', '^binary_sensor\.')
           | rejectattr('state', 'in', ['unknown', 'unavailable'])
           | list | count > 0 }}
      state: >
        {% set ns = namespace(problem=false) %}
        {% for s in expand(integration_entities('duplicati'))
             | selectattr('entity_id', 'search', '^binary_sensor\..*_status$') %}
          {% if s.state == 'on' %}
            {% set ns.problem = true %}
          {% endif %}
        {% endfor %}
        {% for s in expand(integration_entities('duplicati'))
             | selectattr('entity_id', 'search', '^sensor\..*_next_scheduled_execution$')
             | rejectattr('state', 'in', ['unknown', 'unavailable']) %}
          {% if as_datetime(s.state) < now() %}
            {% set ns.problem = true %}
          {% endif %}
        {% endfor %}
        {{ 'Problem' if ns.problem else 'OK' }}
      attributes:
        # Named per job so a problem is actionable without opening Duplicati.
        problems: >
          {% set ns = namespace(bad=[]) %}
          {% for s in expand(integration_entities('duplicati'))
               | selectattr('entity_id', 'search', '^binary_sensor\..*_status$') %}
            {% if s.state == 'on' %}
              {% set job = s.name | replace(' Status', '') %}
              {% set err_id = s.entity_id
                   | replace('binary_sensor.', 'sensor.')
                   | replace('_status', '_error_message') %}
              {% set err = states(err_id) %}
              {% set ns.bad = ns.bad
                   + [job ~ (': ' ~ err if err not in ['unknown', 'unavailable', 'None', ''] else '')] %}
            {% endif %}
          {% endfor %}
          {% for s in expand(integration_entities('duplicati'))
               | selectattr('entity_id', 'search', '^sensor\..*_next_scheduled_execution$')
               | rejectattr('state', 'in', ['unknown', 'unavailable']) %}
            {% if as_datetime(s.state) < now() %}
              {% set job = s.name | replace(' Next scheduled execution', '') %}
              {% set ns.bad = ns.bad + [job ~ ': overdue since ' ~ s.state] %}
            {% endif %}
          {% endfor %}
          {{ ns.bad | join(', ') }}
        job_count: >
          {{ expand(integration_entities('duplicati'))
             | selectattr('entity_id', 'search', '^binary_sensor\..*_status$')
             | list | count }}
        # A job actively running is not a problem, but it is the reason a
        # dashboard glance might look "stuck" mid-backup — surfaced so the
        # verdict card can mention it without it being an alert on its own.
        running: >
          {% set ns = namespace(jobs=[]) %}
          {% for s in expand(integration_entities('duplicati'))
               | selectattr('entity_id', 'search', '^binary_sensor\..*_running$') %}
            {% if s.state == 'on' %}
              {% set ns.jobs = ns.jobs + [s.name | replace(' Running', '')] %}
            {% endif %}
          {% endfor %}
          {{ ns.jobs | join(', ') }}
        # Most recent completion across every job — a tile can show an
        # attribute but not `last_changed`, so this is the value the Backups
        # page reads for its "Last backup" tile.
        last_backup: >
          {% set dates = expand(integration_entities('duplicati'))
               | selectattr('entity_id', 'search', '^sensor\..*_date$')
               | rejectattr('state', 'in', ['unknown', 'unavailable'])
               | map(attribute='state') | map('as_datetime') | list %}
          {{ dates | max if dates else 'unknown' }}
