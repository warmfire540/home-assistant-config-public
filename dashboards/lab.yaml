---
#####
# lab — lab-wide monitoring
#
# Entry point only:
#
#   lab.yaml                 this file — title, theme, includes
#   lab/views/NN-*.yaml      one view per file, ordered by filename
#   templates/*.yaml         shared with jack-sparrow (same directory)
#   cards/portal-row.yaml    shared portal row, `!include`d as one card
#
# `!include_dir_list` sorts by filename, hence the NN- prefixes.
#
# Views: Uptime, Backups, Pi-hole, Z-Wave. The Matrix subviews
# `/the-matrix/lab` and `/the-matrix/z-wave` are gone; Home's server-closet
# card lands here (`/home-lab/uptime`).
#
# Own dashboard because Kuma watches the whole lab (gateway, ISP, Pis, HA),
# and only the container happens to run on the NAS. Same for Backups:
# Duplicati runs on the NAS, a backup job is a lab-wide concern.
# 02-backups.yaml answers "did the last run succeed"; Healthchecks (not
# built yet, see TODO.md) will answer "did it run at all".
# Pi-hole and Z-Wave are lab-wide too — not a jack-sparrow concern.
#
# `templates` is dashboards/templates/, the same directory jack-sparrow.yaml
# loads. Editing a file there changes both dashboards. `[[[ ... ]]]` exists
# on this dashboard only inside templates/portal_button.yaml; view files stay
# on Jinja.
#
# No monitor name appears in lab/views/. Cards are built from
# `integration_entities('uptime_kuma')` at render time, so adding or deleting
# a monitor in Kuma needs no edit here. Same for 02-backups.yaml off
# `integration_entities('duplicati')` (that page's `*_status` binary is
# device_class: problem — on means a problem). The two named exceptions are
# `Internet` and `Gateway` in entities/templates/uptime_kuma.yaml, which back
# `binary_sensor.lab_wan_down`.
#
# Requires HACS: `auto-entities`, plus mushroom for the status tiles.
#
# Deploy steps, monitor table and alerting: servers repo,
# hosts/jack-sparrow/uptime-kuma-runbook.md.
#####

button_card_templates: !include_dir_merge_named templates

title: 'Lab'
theme: 'minimalist-desktop'

views: !include_dir_list lab/views
