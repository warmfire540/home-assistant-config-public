---
#####
# portal_button — one "leave Home Assistant" link
#
# Shared by every YAML dashboard. Both `jack-sparrow.yaml` and `lab.yaml`
# load this directory; a template is only reachable from the dashboard
# whose `button_card_templates:` block loaded it. The row that arranges
# these is templates/portal_row.yaml. Destinations live in
# dashboards/cards/portal-row.yaml.
#
# Call sites set:
#   name              — the destination, as a label
#   icon              — the destination's mark
#   variables.url     — where it opens
#   variables.subtitle— host:port, printed so you know where you are going
#   variables.accent  — a theme var, used for icon + tint
#
# button-card's `tap_action: { action: url }` takes `url_path`, not `url`.
# Writing `url:` parses fine and produces a button that does nothing on
# tap, with no console error.
#
# No `new_tab`. The companion app opens external URLs in an in-app browser
# anyway, and on desktop the back button should return to the dashboard.
#
# The arrow is its own grid cell, top right. It used to live inside
# `label` next to the subtitle; `label` ellipsises, so the icon was the
# first thing overflow ate. `show_label: true` is required here or the
# subtitle cell renders empty.
#####

portal_button:
  variables:
    url: ''
    subtitle: ''
    accent: 'var(--primary-color)'
  show_icon: true
  show_name: true
  show_label: true
  size: 22px
  label: '[[[ return variables.subtitle; ]]]'
  # Decorative. The whole card is already the tap target (`tap_action: url`);
  # this just marks the destination as outside HA. `pointer-events: none` so
  # a tap on the corner still hits the card, not a nested ha-icon.
  custom_fields:
    arrow: |
      [[[
        return `<ha-icon icon="mdi:open-in-new"></ha-icon>`;
      ]]]
  tap_action:
    action: url
    url_path: '[[[ return variables.url; ]]]'
  styles:
    # Icon left, name + arrow on the first text row, subtitle full-width
    # under the name. Same left-icon shape as the per-drive cards.
    grid:
      - grid-template-areas: '"i n arrow" "i l l"'
      # 30px icon gutter, 14px arrow. If this crowds on a phone, change
      # `--portal-basis` in dashboards/templates/portal_row.yaml.
      - grid-template-columns: 30px 1fr 14px
      - grid-template-rows: auto auto
      - align-items: center
    card:
      - border-radius: 14px
      - height: 68px
      - padding: 9px 11px
      - background: '[[[ return `color-mix(in srgb, ${variables.accent} 8%, var(--card-background-color))`; ]]]'
      - border: '[[[ return `1px solid color-mix(in srgb, ${variables.accent} 22%, transparent)`; ]]]'
      - box-shadow: none
    img_cell:
      - justify-self: start
    icon:
      - color: '[[[ return variables.accent; ]]]'
    name:
      - font-size: 0.92em
      - font-weight: 600
      - color: var(--primary-text-color)
      - justify-self: start
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
    label:
      - font-size: 0.69em
      - color: var(--secondary-text-color)
      - justify-self: start
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
    custom_fields:
      arrow:
        - justify-self: end
        - align-self: start
        - line-height: 0
        - opacity: 0.45
        - pointer-events: none
        - '--mdc-icon-size': 12px
