---
#####
# portal_button — the "leave Home Assistant" link
#
# Every external tool behind these dashboards (UGOS, Portainer, Scrutiny,
# Uptime Kuma) is better at its own drill-down than any Lovelace card can be,
# so every page wants a way out to them. This is the one shape they all share,
# so a portal button looks the same wherever it appears and never looks like a
# control.
#
# ⚠️ THIS TEMPLATE IS SHARED BY EVERY YAML DASHBOARD. It moved here from
# `jack-sparrow/templates/` on 2026-08-13, and was renamed from
# `ugreen_portal_button` at the same time — there is nothing UGREEN-specific
# about it, and half the destinations it points at are not UGREEN products.
# Both `jack-sparrow.yaml` and `lab.yaml` load this directory. See
# `dashboards/cards/portal-row.yaml` for the row that uses it; changing THAT
# file changes every page at once, which is the point.
#
# ⚠️ BUTTON-CARD TEMPLATES DO NOT CROSS DASHBOARDS. A template is only
# reachable from the dashboard whose `button_card_templates:` block loaded it.
# That is why this file being in a shared *directory* is not enough on its own
# — each dashboard has to include the directory. It is also why lab.yaml used
# to have a hand-rolled `tile` version of this row instead: it had no
# templates block at all.
#
# Call sites set:
#   name              — the destination, as a label
#   icon              — the destination's mark
#   variables.url     — where it opens
#   variables.subtitle— host:port, printed so you know where you are going
#   variables.accent  — a theme var, used for icon + tint
#
# WHY url_path AND NOT action: url
#
# button-card's `tap_action: { action: url }` takes `url_path`, NOT `url` —
# the same key the core navigate action uses for its own path. Writing `url:`
# parses fine and produces a button that does nothing at all on tap. There is
# no console error either; the action just resolves to undefined.
#
# `new_tab` is deliberately absent. In the HA companion app an external URL
# opens in an in-app browser regardless, and on desktop keeping it in the same
# tab means the back button returns to the dashboard — which is what you want
# after glancing at a drive's attribute page.
#
# THE ARROW IS A `label`, NOT PART OF THE NAME
#
# It sits in its own grid cell pinned right, so a long subtitle ellipsises
# under it rather than shoving it off the card. `show_label: true` is required
# at the call site level or the cell renders empty — it is set here so call
# sites cannot forget it.
#####

portal_button:
  variables:
    url: ''
    subtitle: ''
    accent: 'var(--primary-color)'
  show_icon: true
  show_name: true
  show_label: true
  size: 22px
  label: |
    [[[
      return `<span style="opacity:0.8">${variables.subtitle}</span>
              <ha-icon icon="mdi:open-in-new"
                       style="--mdc-icon-size:15px;
                              vertical-align:-3px;
                              margin-left:5px;
                              opacity:0.65"></ha-icon>`;
    ]]]
  tap_action:
    action: url
    url_path: '[[[ return variables.url; ]]]'
  styles:
    # Icon left, name over subtitle on the right — the same left-icon shape the
    # per-drive cards on the Drives page use, so the two read as one system.
    grid:
      - grid-template-areas: '"i n" "i l"'
      # 30px, down from 34 when this row went from three buttons to four.
      #
      # The constraint has not changed, only the arithmetic: the subtitle
      # `192.168.5.8:9999` is the whole job of a button whose purpose is
      # telling you where it goes, and it must not ellipsise to
      # `192.168.5.8:999…`. At `columns: 3` of a 12-column section each card
      # is a quarter of the page rather than a third, so the icon gutter and
      # the label size both came down to buy the text back. The icon is 22px;
      # 30 is enough to sit it off the text without spending width on
      # whitespace.
      #
      # If this still crowds on a phone, do NOT edit this file — change
      # `columns:` in dashboards/cards/portal-row.yaml and every page follows.
      - grid-template-columns: 30px 1fr
      - grid-template-rows: auto auto
      - align-items: center
    card:
      - border-radius: 14px
      - height: 68px
      - padding: 9px 11px
      # Same faint accent wash as ugreen_power_button, so an external link is
      # visibly the same class of object as the other actions on the page
      # without competing with them for attention.
      - background: '[[[ return `color-mix(in srgb, ${variables.accent} 8%, var(--card-background-color))`; ]]]'
      - border: '[[[ return `1px solid color-mix(in srgb, ${variables.accent} 22%, transparent)`; ]]]'
      - box-shadow: none
    img_cell:
      - justify-self: start
    icon:
      - color: '[[[ return variables.accent; ]]]'
    name:
      - font-size: 0.92em
      - font-weight: 600
      - color: var(--primary-text-color)
      - justify-self: start
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
    label:
      - font-size: 0.69em
      - color: var(--secondary-text-color)
      - justify-self: start
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
