---
#####
# portal_row — flex-wrap shell the portal buttons sit in
#
# HA's `type: grid` renders `columns: N` at every viewport width, so five
# across on a phone became ~55px buttons with the subtitle ellipsised.
# Layout lives on this parent: each button's `:host` is its own shadow
# root, so CSS on `portal_button` cannot wrap the row.
#
# Flex wrap, ~140px per button. One media query pins 2-up under 600px.
# No column count, so adding a tool does not touch the CSS.
#
# Adding a tool: a card in dashboards/cards/portal-row.yaml and a
# `fieldNN: [- display: block]` entry below. A field present in the card
# file but missing here does not render (no error, no gap).
#
# Loaded by both dashboards via
# `button_card_templates: !include_dir_merge_named templates`.
#####

portal_row:
  entity: none
  show_icon: false
  show_name: false
  show_state: false
  show_label: false
  # Layout only. Without these the whole row is one giant tap target that
  # ripples on press and swallows taps meant for the buttons inside it.
  tap_action:
    action: none
  hold_action:
    action: none
  double_tap_action:
    action: none
  # Flex, not grid. button-card ships `#container.vertical.no-icon...`
  # rules using the `grid-template` shorthand, which resets areas, rows
  # AND columns. Longhand overrides lose no matter how many !importants
  # you add. Flex ignores them and needs no per-field area names.
  #
  # The element is `#container` (verified in the DOM, not `#states`). A
  # wrong selector here fails silently: no grid, all fields stacked.
  #
  # Leave `styles.grid` empty: it renders as an inline style and beats
  # these rules, including the media query.
  extra_styles: |
    #container {
      display: flex !important;
      flex-wrap: wrap !important;
      gap: 8px;
    }
    #container > div {
      flex: 1 1 var(--portal-basis, 140px);
      min-width: 0;
    }
    @media (max-width: 599px) {
      #container { --portal-basis: 44%; }
    }
  styles:
    card:
      # Transparent shell: the buttons carry their own accent wash and
      # border. A card background here would frame them in a second box.
      - background: none
      - box-shadow: none
      - border: none
      - padding: 0
      - margin: 0
    # No `grid:` block. Anything set here becomes an inline style and
    # silently beats the media queries. See extra_styles above.
    custom_fields:
      field01:
        - display: block
      field02:
        - display: block
      field03:
        - display: block
      field04:
        - display: block
      field05:
        - display: block
      field06:
        - display: block
      field07:
        - display: block
      field08:
        - display: block
      field09:
        - display: block
      # These numbers are not display order. Order is document order in
      # cards/portal-row.yaml (alphabetical after UGOS); 10–15 were
      # appended because they were added last.
      field10:
        - display: block
      field11:
        - display: block
      field12:
        - display: block
      field13:
        - display: block
      field14:
        - display: block
      field15:
        - display: block
