---
#####
# portal_row — the responsive shell the portal buttons sit in
#
# Added 2026-08-14, when Dozzle made the row six wide and the phone layout
# finally became indefensible. Healthchecks + Duplicati made it nine on
# 2026-08-14.
#
# WHY THIS EXISTS AT ALL
#
# The row used to be `type: grid` with `columns: 5`. HA's grid card renders
# that count at every viewport width — five across on a 27" monitor and five
# across on a phone. At phone width each button was ~55px, which turned the
# subtitle (`192.168.5.8:81`, the button's entire reason for being) into an
# ellipsis. The core grid card has no breakpoints, and `layout-card` — which
# does — is not installed in this config and is not worth a new HACS
# dependency for one row.
#
# A `custom:button-card` holds the buttons in `custom_fields`, and its
# `#container` gets flex-wrapped by `extra_styles` below — one element owning
# both the layout and the children, so it can actually reflow.
#
# ⚠️ THE LAYOUT MUST LIVE ON THE PARENT, NOT THE BUTTONS. Styling from
# `portal_button`'s own `extra_styles` looks equivalent and cannot work: each
# button's `:host` is its own element in its own shadow root, invisible to the
# parent that positions it, and CSS has no child-to-parent selector.
#
# LAYOUT
#
# Flex wrap, ~140px per button: as many per row as fit, the rest wrap. One
# media query pins 2-up under 600px. No fixed column counts, so nothing here
# needs touching when a tool is added or removed.
#
# ADDING A TOOL: add the card in dashboards/cards/portal-row.yaml and
# a `fieldNN: [- display: block]` entry in `custom_fields` below. That is all —
# there are no area names to keep in sync.
#
# Loaded by both dashboards via
# `button_card_templates: !include_dir_merge_named templates`.
#####

portal_row:
  entity: none
  show_icon: false
  show_name: false
  show_state: false
  show_label: false
  # The shell is a layout, not a control. Without these the whole row is one
  # giant tap target that ripples on press and does nothing, and it swallows
  # taps meant for the buttons inside it.
  tap_action:
    action: none
  hold_action:
    action: none
  double_tap_action:
    action: none
  # FLEX, NOT GRID — and that is the whole trick.
  #
  # button-card ships a stack of `#container.vertical.no-icon.no-name...`
  # rules using the `grid-template` SHORTHAND, which resets areas, rows AND
  # columns. Overriding those with longhand `grid-template-areas` /
  # `-columns` loses no matter how many !importants you add. Flex ignores
  # every one of them, wraps on its own, and needs no per-field area names.
  #
  # The element is `#container` (verified in the DOM, not `#states`), and a
  # wrong selector here fails silently — no grid, all fields stacked.
  #
  # `styles.grid` is deliberately empty: it renders as an INLINE style, which
  # would beat these rules.
  #
  # Sizing: each button wants ~140px, so a row fits as many as the width
  # allows and wraps the rest — no breakpoints needed for desktop/tablet. The
  # one media query forces exactly 2-up on a phone (44% + gap), because
  # letting 140px decide there gives an ugly 2/1 orphan on narrow handsets.
  extra_styles: |
    #container {
      display: flex !important;
      flex-wrap: wrap !important;
      gap: 8px;
    }
    #container > div {
      flex: 1 1 var(--portal-basis, 140px);
      min-width: 0;
    }
    @media (max-width: 599px) {
      #container { --portal-basis: 44%; }
    }
  styles:
    card:
      # Transparent shell: the buttons carry their own accent wash and border,
      # and a card background here would frame them in a second box.
      - background: none
      - box-shadow: none
      - border: none
      - padding: 0
      - margin: 0
    # No `grid:` block — see the note on extra_styles above. Anything set here
    # becomes an inline style and silently beats the media queries.
    custom_fields:
      field01:
        - display: block
      field02:
        - display: block
      field03:
        - display: block
      field04:
        - display: block
      field05:
        - display: block
      field06:
        - display: block
      field07:
        - display: block
      field08:
        - display: block
      field09:
        - display: block
