---
#####
# PI-HOLE — DNS / ad-blocking for the lab
#
# This is why `/the-matrix/lab` existed. That Matrix subview is gone; the
# server-closet card on Home now lands on `/home-lab/uptime`, and this tab
# is the Pi-hole card plus the backup timestamp that used to sit next to it.
#
# The card discovers every Pi-hole entity from `device_id`. That id is
# opaque (HA device registry); the comment above the card is the only
# label. Re-copy it from Settings → Devices if the Pi is ever re-added.
#
# `url` is the admin UI the card's title/badge opens. `poat-hole.local` is
# mDNS, so it still works when NPM or the wildcard is down — the case you
# actually want a Pi-hole link for.
#
# Last backup is `sensor.pi_hole_server_last_backup` from
# entities/command_line/sensors/pi_backups.yaml (finds the newest file under
# `/media/pi_backups/pihole-backup`). It is named here because it is not a
# Pi-hole integration entity; the card cannot discover it.
#
# Kuma already watches `poat-hole - DNS` and `poat-hole - admin` on the
# Uptime tab. This page does not duplicate those tiles.
#
# LAYOUT (max_columns: 3)
#
#   row 1   Pi-hole     span 3   portals + last backup + the card
#
# Requires HACS: `pi-hole-card`.
#####

title: Pi-hole
path: pi-hole
icon: mdi:pi-hole
type: sections
max_columns: 3
dense_section_placement: true
cards: []
sections:
  #####################################################################
  # PI-HOLE — the card that used to live on /the-matrix/lab
  #####################################################################
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading: Pi-hole
        heading_style: title
        icon: mdi:pi-hole

      # Shared card: dashboards/cards/portal-row.yaml.
      # `!include` is relative to this file, hence ../../ from
      # dashboards/<dash>/views/.
      - !include ../../cards/portal-row.yaml

      # `grid_options.columns: full` is load-bearing — without it this
      # packs onto the portal row. See 02-backups.yaml.
      - type: grid
        square: false
        columns: 1
        grid_options:
          columns: full
          rows: auto
        cards:
          - type: tile
            entity: sensor.pi_hole_server_last_backup
            name: Last backup
            icon: mdi:backup-restore
            vertical: true
            color: grey

      # poat-hole (Pi-hole). device_id is the registry id, not an entity.
      - type: custom:pi-hole
        device_id: 71f75a06cb6f6be6f8640f281c2d30bc
        url: http://poat-hole.local
        grid_options:
          columns: full
          rows: auto
