---
#####
# BACKUPS — Duplicati job health
#
# Healthchecks answers "did the nightly job run at all" (not yet built, see
# TODO.md). This page answers the next question: did it succeed, how long
# did it take, and how much did it move.
#
# No backup job is named here. Every card is an `auto-entities` template over
# `integration_entities('duplicati')`. Add a job in Duplicati, select it in
# the integration options, and it appears here with no dashboard edit.
#
# hass-duplicati gives each job one device (`<name> Backup`) carrying a
# fixed entity set. Cards are built from `binary_sensor.*_status` plus
# `device_entities(device_id(e))` for siblings (same pattern as the
# Uptime monitor board). Verified 2026-08-24 against the live instance:
# 18 jobs, each with Status (device_class: problem), Running, Date,
# Duration (seconds), Next, Error, Source/Target files + size, Create
# Backup, Refresh. Files/sizes and the two buttons stay on more-info.
#
# `binary_sensor.*_status` is device_class: problem. ON MEANS A PROBLEM.
# Colour/icon templates on this page treat `on` as red and `off` as green
# for that sensor. Do not copy the Scrutiny/Portainer "on = healthy"
# convention here.
#
# Every `filter: template:` must end in one `{{ ... }}` that evaluates to a
# list. See lab/views/01-uptime.yaml. Accumulate into a namespace list, emit
# it as the last statement.
#
# LAYOUT (max_columns: 3)
#
#   row 1   Backups        span 3   portals + verdict + backup-glance
#   row 2   Jobs           span 3   2-up compact mushroom cards
#
# Glance is `cards/backup-glance.yaml` (same card as Uptime / Hosts):
# three rollup tiles, not one date tile per job.
#
# Job cards name no job. Same auto-entities pattern as the Uptime
# monitor board. The card is name + last/next/duration; problems and
# overdue jobs sort to the top.
#
# Reads: entities/templates/duplicati.yaml
# Upstream: https://github.com/txxa/hass-duplicati
#####

title: Backups
path: backups
icon: mdi:backup-restore
type: sections
max_columns: 3
dense_section_placement: true
cards: []
sections:
  #####################################################################
  # HEADLINE — the verdict, then the way out, then the three numbers
  #####################################################################
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading: Backups
        heading_style: title
        icon: mdi:backup-restore

      # Shared card: dashboards/cards/portal-row.yaml.
      # `!include` is relative to this file, hence ../../ from
      # dashboards/<dash>/views/.
      - !include ../../cards/portal-row.yaml

      # `grid_options.columns: full` is load-bearing — see the note on
      # 04-drives.yaml / 05-containers.yaml: without it this card packs onto
      # the portal row instead of sitting underneath it.
      - type: markdown
        grid_options:
          columns: full
          rows: auto
        # Literal block (`|`), not folded (`>-`) — folding joins consecutive
        # lines with spaces and collapses adjacent list items onto one line.
        content: |
          {% set h = 'sensor.duplicati_backup_health' %}
          {% set jobs = state_attr(h, 'job_count') | int(0) %}
          {% set running = state_attr(h, 'running') %}
          {% if states(h) in ['unknown', 'unavailable'] %}
          ## ⚠️ Duplicati is not reporting

          The integration is unavailable, which is **not** the same as every
          job being healthy. Check the container itself at
          <https://duplicati.home.masterscrib.net>. This page structurally
          cannot show you that outage.
          {% elif states(h) == 'OK' %}
          ## ✅ All {{ jobs }} job{{ '' if jobs == 1 else 's' }} healthy
          {% else %}
          ## 🔴 Needs a look

          {{ state_attr(h, 'problems') }}
          {% endif %}
          {% if running %}

          > **Running now: {{ running }}.** A low file/size count on that
          > job's card below is mid-backup, not a shrunk source.
          {% endif %}

      # Shared card: dashboards/cards/backup-glance.yaml.
      # Three rollup tiles. Same card as Uptime / Hosts.
      - !include ../../cards/backup-glance.yaml

  #####################################################################
  # JOBS — one card per backup job
  #####################################################################
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading: Jobs
        heading_style: title
        icon: mdi:format-list-checks

      - type: custom:auto-entities
        show_empty: false
        grid_options:
          columns: full
          rows: auto
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          template: >
            {% set missing = ['unknown', 'unavailable', 'None', ''] %}
            {% set ns = namespace(rows=[]) %}
            {% for e in integration_entities('duplicati')
                 | select('search', '^binary_sensor\..*_status$') %}
              {% set sibs = device_entities(device_id(e)) %}
              {% set running_e = sibs | select('search', '_running$') | list %}
              {% set date_e = sibs | select('search', '_date$') | list %}
              {% set dur_e = sibs | select('search', '_duration$') | list %}
              {% set next_e = sibs | select('search', '_next_scheduled_execution$') | list %}
              {% set err_e = sibs | select('search', '_error_message$') | list %}
              {% set problem = states(e) == 'on' %}
              {% set running = running_e and states(running_e[0]) == 'on' %}
              {% set last = states(date_e[0]) if date_e else 'unknown' %}
              {% set nxt = states(next_e[0]) if next_e else 'unknown' %}
              {% set err = states(err_e[0]) if err_e else '' %}
              {% set overdue = nxt not in missing and as_datetime(nxt) < now() %}
              {% set job = state_attr(e, 'friendly_name')
                   | default(e, true)
                   | replace(' Status', '')
                   | replace(' Backup', '') %}
              {% set line = namespace(bits=[]) %}
              {% if running %}
                {% set line.bits = line.bits + ['running'] %}
              {% endif %}
              {% if last in missing %}
                {% set line.bits = line.bits + ['never run'] %}
              {% else %}
                {% set line.bits = line.bits
                     + [relative_time(as_datetime(last)) ~ ' ago'] %}
              {% endif %}
              {% if dur_e and states(dur_e[0]) not in missing %}
                {% set sec = states(dur_e[0]) | float(-1) %}
                {% if sec >= 3600 %}
                  {% set line.bits = line.bits + [(sec / 3600) | round(1) ~ 'h'] %}
                {% elif sec >= 60 %}
                  {% set line.bits = line.bits + [(sec / 60) | round(0) | int ~ 'm'] %}
                {% elif sec >= 0 %}
                  {% set line.bits = line.bits + [sec | round(0) | int ~ 's'] %}
                {% endif %}
              {% endif %}
              {% if nxt not in missing %}
                {% if overdue %}
                  {% set line.bits = line.bits + ['overdue'] %}
                {% else %}
                  {% set line.bits = line.bits
                       + ['next ' ~ (as_timestamp(nxt) | timestamp_custom('%a %H:%M', true))] %}
                {% endif %}
              {% endif %}
              {% if problem and err not in missing %}
                {% set line.bits = line.bits + [err] %}
              {% endif %}
              {% set rank = '0' if (problem or overdue)
                   else ('1' if running
                   else ('2' if states(e) == 'off' else '3')) %}
              {% set ns.rows = ns.rows + [(rank ~ job | lower, {
                   'type': 'custom:mushroom-template-card',
                   'entity': e,
                   'primary': job,
                   'secondary': line.bits | join(' · ') or states(e),
                   'icon': 'mdi:progress-clock' if running
                     else ('mdi:alert-circle' if (problem or overdue)
                     else 'mdi:check-circle'),
                   'icon_color': 'orange' if running
                     else ('red' if (problem or overdue)
                     else ('green' if states(e) == 'off' else 'grey')),
                   'multiline_secondary': true,
                   'tap_action': {'action': 'more-info'}
                 })] %}
            {% endfor %}
            {{ ns.rows | sort(attribute='0') | map(attribute='1') | list }}
