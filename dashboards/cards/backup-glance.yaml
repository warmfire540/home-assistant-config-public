---
#####
# backup-glance — Duplicati rollup as ONE card
#
# Include as a single list item from any Lab view:
#
#   - !include ../../cards/backup-glance.yaml
#
# Same rule as portal-row.yaml: `!include` is one node, so this file is
# one card, not a list. `grid_options.columns: full` is load-bearing.
#
# Three tiles only: health, job count, most recent completion. Per-job
# dates used to live here too; with 18 jobs that became a dump. Job
# detail lives on `/home-lab/backups`. Add a job in Duplicati (and
# select it in the integration options) and the count tile moves;
# the Backups page picks up the card.
#
# Tap goes to `/home-lab/backups` (fine on that page too).
#####

type: custom:auto-entities
show_empty: false
grid_options:
  columns: full
  rows: auto
card:
  type: grid
  columns: 3
  square: false
card_param: cards
filter:
  template: >
    {% set nav = {
         'action': 'navigate',
         'navigation_path': '/home-lab/backups' } %}
    {% set h = 'sensor.duplicati_backup_health' %}
    {{ [
         {
           'type': 'tile',
           'entity': h,
           'name': 'Duplicati',
           'icon': 'mdi:backup-restore',
           'vertical': true,
           'tap_action': nav
         },
         {
           'type': 'tile',
           'entity': h,
           'name': 'Jobs seen',
           'icon': 'mdi:counter',
           'vertical': true,
           'color': 'grey',
           'state_content': 'job_count',
           'tap_action': nav
         },
         {
           'type': 'tile',
           'entity': h,
           'name': 'Last backup',
           'icon': 'mdi:clock-check-outline',
           'vertical': true,
           'color': 'grey',
           'state_content': 'last_backup',
           'tap_action': nav
         }
       ] }}
