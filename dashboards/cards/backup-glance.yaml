---
#####
# backup-glance — Duplicati status as ONE card
#
# Include as a single list item from any Lab view:
#
#   - !include ../../cards/backup-glance.yaml
#
# Same rule as portal-row.yaml: `!include` is one node, so this file is
# one card, not a list. `grid_options.columns: full` is load-bearing.
#
# No job is named here. The first three tiles are the rollup
# (`sensor.duplicati_backup_health`); the rest are each job's `_date`
# sensor from `integration_entities('duplicati')`. Add a job in
# Duplicati and it appears on the next poll — that is the source of
# truth for "when did this thing last back up".
#
# Command_line `*_last_backup` sensors (pi_backups.yaml) are NOT on
# this card. They `find` files under `/media/pi_backups/...` and the
# Deluge / Plex paths may not match anything that still runs. Do not
# add more of those; add a Duplicati job instead.
#
# Tap goes to `/home-lab/backups` (fine on that page too).
#####

type: custom:auto-entities
show_empty: false
grid_options:
  columns: full
  rows: auto
card:
  type: grid
  columns: 4
  square: false
card_param: cards
filter:
  template: >
    {% set nav = {
         'action': 'navigate',
         'navigation_path': '/home-lab/backups' } %}
    {% set h = 'sensor.duplicati_backup_health' %}
    {% set ns = namespace(rows=[
         {
           'type': 'tile',
           'entity': h,
           'name': 'Duplicati',
           'icon': 'mdi:backup-restore',
           'vertical': true,
           'tap_action': nav
         },
         {
           'type': 'tile',
           'entity': h,
           'name': 'Jobs seen',
           'icon': 'mdi:counter',
           'vertical': true,
           'color': 'grey',
           'state_content': 'job_count',
           'tap_action': nav
         },
         {
           'type': 'tile',
           'entity': h,
           'name': 'Last backup',
           'icon': 'mdi:clock-check-outline',
           'vertical': true,
           'color': 'grey',
           'state_content': 'last_backup',
           'tap_action': nav
         }
       ]) %}
    {% for e in integration_entities('duplicati')
         | select('search', '^sensor\..*_date$') | sort %}
      {% set nm = state_attr(e, 'friendly_name')
           | default(e, true)
           | replace(' Date', '')
           | replace(' Backup', '') %}
      {% set ns.rows = ns.rows + [{
           'type': 'tile',
           'entity': e,
           'name': nm,
           'icon': 'mdi:calendar-check',
           'vertical': true,
           'color': 'grey',
           'tap_action': nav
         }] %}
    {% endfor %}
    {{ ns.rows }}
