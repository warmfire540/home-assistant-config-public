---
#####
# portal-row — shared exit row on every YAML dashboard view
#
# One card. Edit here, every page updates. Include as a single list item:
#
#   - !include ../../cards/portal-row.yaml
#
# `!include` is relative to the including file (`dashboards/<dash>/views/`).
# It substitutes one YAML node, so this file must be one card, not a list —
# Lovelace rejects a nested list. `grid_options: columns: full` is required:
# without it a sections-view card takes half the 12-column grid and this row
# packs into the left half of the page.
#
# Wrapper is `custom:button-card` + `portal_row`, which flex-wraps at ~140px
# (2-up on a phone). HA's `type: grid` has no breakpoints. Sizing lives in
# templates/portal_row.yaml.
#
# Adding a tool: a block here plus a `fieldNN` cell in `portal_row`'s
# `custom_fields`. `fieldNN` is a name, not order. Display order is document
# order below: UGOS first, then alphabetical.
#
# Bazarr, Prowlarr, Radarr and Sonarr share indigo `#3f51b5` (one stack, one
# colour). Leave `--info-color` to Portainer and `--primary-color` to UGOS.
#
# Hostnames go through NPM (`*.home.masterscrib.net`), so Pi-hole and NPM
# both have to be up. Two things stay on IP on purpose:
#   - Kuma monitors still target IP:port, so monitoring survives DNS/proxy
#     failure
#   - NPM's button stays http://192.168.5.8:81. A recovery link that
#     depends on NPM is not a recovery link.
#
# UGOS "HTTP to HTTPS redirect" must stay off or this button bounces to
# https://192.168.5.8:9443. The UGREEN integration also 400s when it is on.
#
# Both dashboards must load templates/portal_row.yaml and
# templates/portal_button.yaml via
# `button_card_templates: !include_dir_merge_named templates`.
#####

type: custom:button-card
template: portal_row
grid_options:
  columns: full
  rows: auto
custom_fields:
  field01:
    card:
      type: custom:button-card
      template: portal_button
      name: UGOS
      icon: mdi:nas
      variables:
        url: https://ugos.home.masterscrib.net
        subtitle: ugos.home
        accent: var(--primary-color)

  # Arr stack: shared indigo. `fieldNN` is a name, not order.
  field10:
    card:
      type: custom:button-card
      template: portal_button
      name: Bazarr
      icon: mdi:subtitles-outline
      variables:
        url: https://bazarr.home.masterscrib.net
        subtitle: bazarr.home
        accent: '#3f51b5'

  field02:
    card:
      type: custom:button-card
      template: portal_button
      name: Deluge
      icon: mdi:download-network
      variables:
        url: https://deluge.home.masterscrib.net
        subtitle: deluge.home
        # Teal: theme vars are spent, and a second green next to Kuma
        # collides the same way two blues did.
        accent: '#00897b'

  field03:
    card:
      type: custom:button-card
      template: portal_button
      name: Dozzle
      icon: mdi:text-box-search
      variables:
        url: https://dozzle.home.masterscrib.net
        subtitle: dozzle.home
        # Not `--info-color`: that is Portainer's, and they sit side by
        # side alphabetically. Quoted for the `#`.
        accent: 'var(--error-color, #e5573f)'

  field05:
    card:
      type: custom:button-card
      template: portal_button
      name: Duplicati
      icon: mdi:backup-restore
      variables:
        url: https://duplicati.home.masterscrib.net
        subtitle: duplicati.home
        accent: '#455a64'

  field15:
    card:
      type: custom:button-card
      template: portal_button
      name: Frigate
      icon: mdi:cctv
      variables:
        url: https://frigate.home.masterscrib.net
        subtitle: frigate.home
        # Blue-grey: theme vars and the nearby Duplicati grey are spent.
        accent: '#546e7a'

  field04:
    card:
      type: custom:button-card
      template: portal_button
      name: Healthchecks
      icon: mdi:heart-pulse
      variables:
        url: https://healthchecks.home.masterscrib.net
        subtitle: healthchecks.home
        # Magenta: theme vars are spent, and a second red next to Dozzle
        # would collide. Quoted for the `#`.
        accent: '#c2185b'

  # Recovery path: must stay an IP. See the header.
  field06:
    card:
      type: custom:button-card
      template: portal_button
      name: NPM
      icon: mdi:shield-key
      variables:
        url: http://192.168.5.8:81
        subtitle: 192.168.5.8:81
        accent: 'var(--warning-color, #ff9800)'

  # App portal, not lab infra — brown is unused on this row.
  field11:
    card:
      type: custom:button-card
      template: portal_button
      name: Pawsport
      icon: mdi:paw
      variables:
        url: https://pawsport.home.masterscrib.net
        subtitle: pawsport.home
        accent: '#8d6e63'

  field07:
    card:
      type: custom:button-card
      template: portal_button
      name: Portainer
      icon: mdi:docker
      variables:
        url: https://portainer.home.masterscrib.net
        subtitle: portainer.home
        # Quoted: an unquoted `#` starts a YAML comment, so the bare form
        # parses as `var(--info-color,` and silently drops the fallback.
        accent: 'var(--info-color, #039be5)'

  field12:
    card:
      type: custom:button-card
      template: portal_button
      name: Prowlarr
      icon: mdi:magnify-scan
      variables:
        url: https://prowlarr.home.masterscrib.net
        subtitle: prowlarr.home
        accent: '#3f51b5'

  field13:
    card:
      type: custom:button-card
      template: portal_button
      name: Radarr
      icon: mdi:movie-open-outline
      variables:
        url: https://radarr.home.masterscrib.net
        subtitle: radarr.home
        accent: '#3f51b5'

  field08:
    card:
      type: custom:button-card
      template: portal_button
      name: Scrutiny
      icon: mdi:harddisk
      variables:
        url: https://scrutiny.home.masterscrib.net
        subtitle: scrutiny.home
        # `--accent-color` is the remaining theme var distinct from
        # primary / info / success. Fallback because some themes leave it
        # equal to `--primary-color`.
        accent: 'var(--accent-color, #7e57c2)'

  field14:
    card:
      type: custom:button-card
      template: portal_button
      name: Sonarr
      icon: mdi:television-classic
      variables:
        url: https://sonarr.home.masterscrib.net
        subtitle: sonarr.home
        accent: '#3f51b5'

  field09:
    card:
      type: custom:button-card
      template: portal_button
      name: Uptime Kuma
      icon: mdi:lan-check
      variables:
        url: https://kuma.home.masterscrib.net
        subtitle: kuma.home
        accent: 'var(--success-color, #0da035)'
