---
#####
# DRIVES — SMART health per physical disk, from Scrutiny
#
# The NAS view (01-nas.yaml) shows what UGOS thinks: pool state, volume fill,
# and a per-disk "Normal". That is a pass/fail assessment made by the drive
# firmware, and firmware only says "failing" once it already is. This page is
# the other half — Scrutiny's collected SMART attributes, scored against
# BackBlaze's real-world failure rates, with history.
#
# The distinction that matters here: four of these seven drives are
# seller-refurbished, sitting in a RAID 5 with one drive of parity, in a market
# where replacements are expensive and slow. A reallocated sector count moving
# off zero is worth acting on months before anything reports "failed".
#
# DATA SOURCE
#
#   Scrutiny  http://192.168.5.8:8080  (Docker on jack-sparrow, Pool 2)
#   → ha_scrutiny (HACS, vitals5/ha_scrutiny) — one HA device per drive
#   → entities/templates/scrutiny.yaml — the three rollups at the top
#
# Collector runs every 6h. Values only change that often no matter how fast HA
# polls; a flat line between steps is the collector schedule, not a dead sensor.
#
# LAYOUT (max_columns: 3)
#
#   row 1   Health       span 3      (portal buttons + the three tiles)
#   row 2   Drives       span 2      Trends (1)
#
# The two portal buttons at the top are the same `ugreen_portal_button` pair,
# in the same order, as the top of 01-nas.yaml — the way out to UGOS and
# Scrutiny is in the same place with the same look on every page that has one.
#
# WHY NO ugreen_tpl_host WRAPPER
#
# Every other view in this dashboard wraps cards in `ugreen_tpl_host` so they
# can resolve `variables.slug` off the NAS selector. Nothing here is keyed to a
# NAS — Scrutiny entity IDs come from the drive model and serial, and there is
# one Scrutiny instance. So auto-entities sits at view level and the button-card
# templates in its `options:` block use THREE brackets, not four. Copying a
# block out of 01-nas.yaml without dropping a bracket pair will break it.
#####

title: Drives
path: drives
icon: mdi:harddisk
type: sections
max_columns: 3
cards: []
sections:
  #####################################################################
  # HEALTH — the three numbers, above the fold
  #####################################################################
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading: Drive health
        heading_style: title
        icon: mdi:harddisk

      # ---- Portals ----
      # Identical block to the top of 01-nas.yaml, deliberately: same template,
      # same trio, same order, so the way out of HA is in the same place with
      # the same look on every page. This replaced a markdown text link that
      # sat below the disk list and read as a footnote. See the longer note on
      # hardcoded hosts there.
      - type: custom:button-card
        template: ugreen_portal_button
        name: UGOS Portal
        icon: mdi:nas
        grid_options:
          columns: 4
          rows: auto
        variables:
          url: http://192.168.5.8:9999
          subtitle: 192.168.5.8:9999
          accent: var(--primary-color)

      - type: custom:button-card
        template: ugreen_portal_button
        name: Scrutiny
        icon: mdi:harddisk
        grid_options:
          columns: 4
          rows: auto
        variables:
          url: http://192.168.5.8:8080
          subtitle: 192.168.5.8:8080
          # Quoted: an unquoted `#` starts a YAML comment, so the bare form
          # parses as `var(--info-color,` and silently drops the fallback.
          accent: 'var(--info-color, #039be5)'

      - type: custom:button-card
        template: ugreen_portal_button
        name: Uptime Kuma
        icon: mdi:lan-check
        grid_options:
          columns: 4
          rows: auto
        variables:
          url: http://192.168.5.8:3001
          subtitle: 192.168.5.8:3001
          accent: 'var(--success-color, #0da035)'

      # `grid_options.columns: full` is load-bearing, and for a different
      # reason than the one on the auto-entities card below. Without it this
      # grid takes its default half-width and PACKS ONTO THE PORTAL ROW — the
      # two 4-column buttons plus this card all fit inside the section's
      # 12-column grid, so the three tiles ended up inline beside the buttons
      # instead of under them. `full` makes it claim a whole row of its own.
      #
      # 01-nas.yaml does not need this only because its equivalent tile block
      # is wrapped in `ugreen_tpl_host`, which already carries `columns: full`.
      - type: grid
        square: false
        columns: 3
        grid_options:
          columns: full
          rows: auto
        cards:
          # Rolled up in entities/templates/scrutiny.yaml. The `problems`
          # attribute names which drive, which is what the more-info dialog is
          # for — no need to print it on the tile.
          - type: tile
            entity: sensor.scrutiny_drive_health
            name: SMART Status
            vertical: true
            color: |
              [[[
                return states['sensor.scrutiny_drive_health']?.state === 'OK'
                  ? 'green' : 'red';
              ]]]

          # Hottest drive, not average — the array shares one intake, so the
          # worst-case disk is the one that tells you something.
          - type: tile
            entity: sensor.scrutiny_max_drive_temperature
            name: Hottest Drive
            vertical: true
            color: |
              [[[
                const t = Number(states['sensor.scrutiny_max_drive_temperature']?.state);
                if (!Number.isFinite(t)) return 'grey';
                // ⚠️ FAHRENHEIT. ha_scrutiny is natively °C but this instance
                // runs US customary units, so HA converts before a template
                // ever sees the value. 113 °F = 45 °C (where BackBlaze's AFR
                // curve starts climbing), 122 °F = 50 °C (a cooling problem,
                // not a drive problem). Flip these with the unit declared in
                // entities/templates/scrutiny.yaml, never on their own.
                if (t >= 122) return 'red';
                if (t >= 113) return 'orange';
                return 'green';
              ]]]

          # Healthy is a flat zero. Any nonzero value at all is worth opening
          # Scrutiny over, which is why there is no warning band — green or red.
          - type: tile
            entity: sensor.scrutiny_reallocated_sectors_total
            name: Reallocated Sectors
            vertical: true
            color: |
              [[[
                const n = Number(states['sensor.scrutiny_reallocated_sectors_total']?.state);
                return Number.isFinite(n) && n === 0 ? 'green' : 'red';
              ]]]

  #####################################################################
  # DRIVES — one card per physical disk
  #
  # auto-entities keyed on `integration: scrutiny` rather than an entity_id
  # glob: ha_scrutiny names entities after model + serial, so a glob would have
  # to be rewritten every time a drive is replaced. This picks up an RMA'd
  # drive's replacement with no edit.
  #####################################################################
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Disks
        heading_style: title
        icon: mdi:server

      # `grid_options.columns: full` is load-bearing. A card in a sections view
      # defaults to half the section's 12-column grid, so without it the inner
      # 2-up grid rendered at a quarter width each and left the right half of
      # the section empty. Every card in 01-nas.yaml carries the same pair.
      - type: custom:auto-entities
        show_empty: false
        card_param: cards
        grid_options:
          columns: full
          rows: auto
        card:
          type: grid
          columns: 3
          square: false
        # Sorts on the status entity's friendly name, which leads with the
        # model — so the four Ultrastars group together, then the 990 PROs,
        # then the boot SSD. The cards themselves are titled by serial.
        sort:
          method: friendly_name
          numeric: false
        filter:
          include:
            # One status sensor per drive == one card per drive. The rest of
            # that drive's sensors are reached by suffix swap below.
            - integration: scrutiny
              entity_id: '*_overall_status'
              options:
                type: custom:button-card
                entity: this.entity_id
                show_icon: true
                show_name: true
                show_state: true
                show_label: true
                size: 26px
                tap_action:
                  action: more-info
                # Sibling sensors on the same device share the entity_id stem,
                # so they are derived rather than looked up. ha_scrutiny slugs
                # consistently per device; if this ever returns undefined, the
                # suffix changed upstream — check Developer Tools before
                # assuming the sensor is missing.
                #
                # Titled by SERIAL, not model. All four Ultrastars share a
                # model string long enough to truncate, so a model-titled card
                # made them visually identical — useless on the one page whose
                # job is telling you which drive to pull. Serial is also the
                # identity UGOS shows per bay and the one an RMA runs on.
                name: |
                  [[[
                    return entity?.attributes?.serial_number
                      || (entity?.attributes?.friendly_name || entity.entity_id)
                           .replace(/ Overall Status$/, '');
                  ]]]
                state_display: |
                  [[[
                    const id = entity.entity_id;
                    const g = s => states[id.replace('_overall_status', s)]?.state;
                    const cap = Number(g('_capacity'));
                    // Capacity arrives in GB. 11176 GB is technically correct
                    // and reads as noise; 11.2 TB is the number you hold in
                    // your head. Boot SSD stays in GB.
                    const size = Number.isFinite(cap)
                      ? (cap >= 1000 ? `${(cap / 1000).toFixed(1)} TB`
                                     : `${Math.round(cap)} GB`)
                      : null;
                    // `device_name` is whatever path Scrutiny last reported.
                    // Linux does not guarantee /dev/sdX stability across
                    // reboots, so treat it as a hint, not an identity.
                    const dev = entity?.attributes?.device_name;
                    return [size, dev].filter(Boolean).join('  ·  ')
                      || entity?.state || '—';
                  ]]]
                label: |
                  [[[
                    const id = entity.entity_id;
                    const g = s => states[id.replace('_overall_status', s)]?.state;
                    const bits = [];
                    // °F — see the tile threshold comment above. HA has
                    // already converted from ha_scrutiny's native °C.
                    const temp = Number(g('_temperature'));
                    if (Number.isFinite(temp)) bits.push(`${Math.round(temp)}°F`);
                    // ⚠️ ALREADY IN DAYS. The sensor carries
                    // `unit_of_measurement: d` and `device_class: duration`,
                    // so HA hands over 354.08, not 8498 hours. Dividing by 24
                    // turned 354 days into "15d powered" — which looked like
                    // the seller had reset SMART on a refurb drive. It had not.
                    const days = Number(g('_power_on_time'));
                    if (Number.isFinite(days) && days > 0) {
                      bits.push(`${Math.round(days)}d powered`);
                    }
                    const test = g('_smart_test_result');
                    if (test && !['unknown', 'unavailable'].includes(test)) {
                      bits.push(test);
                    }
                    return bits.join(' · ') || entity?.state || '';
                  ]]]
                icon: |
                  [[[
                    // Capacity is the only reliable NVMe/HDD discriminator
                    // exposed here — the 990 PROs are 2TB, the Ultrastars 12TB.
                    const cap = Number(
                      states[entity.entity_id.replace('_overall_status', '_capacity')]?.state
                    );
                    return (Number.isFinite(cap) && cap < 4000)
                      ? 'mdi:chip' : 'mdi:harddisk';
                  ]]]
                styles:
                  grid:
                    - grid-template-areas: '"i n" "i s" "i l"'
                    - grid-template-columns: 44px 1fr
                    - grid-template-rows: auto auto auto
                  card:
                    - height: 92px
                    - padding: 10px 12px
                    - border-radius: 14px
                    - overflow: hidden
                  img_cell:
                    - justify-self: start
                  icon:
                    # Anything that is not an explicit Passed goes red,
                    # including unknown. A monitoring tile that renders a
                    # missing value as green is worse than no tile.
                    - color: |
                        [[[
                          return entity?.state === 'Passed'
                            ? 'var(--success-color, #43a047)'
                            : 'var(--error-color, #f44336)';
                        ]]]
                  name:
                    - font-size: 0.95em
                    - font-weight: 600
                    - color: var(--primary-text-color)
                    - justify-self: start
                    - white-space: nowrap
                    - overflow: hidden
                    - text-overflow: ellipsis
                  state:
                    - font-size: 0.8em
                    - color: var(--secondary-text-color)
                    - justify-self: start
                  label:
                    - font-size: 0.72em
                    - color: var(--secondary-text-color)
                    - opacity: 0.75
                    - justify-self: start
                    - white-space: nowrap
                    - overflow: hidden
                    - text-overflow: ellipsis

      # The escape hatch to Scrutiny's own UI is now the portal button at the
      # top of the page, alongside the same one on 01-nas.yaml. What is left
      # here is the thing a reader of THIS list needs and cannot infer: why the
      # values only move four times a day.
      - type: markdown
        grid_options:
          columns: full
          rows: auto
        content: >-
          Collector runs every 6h — a flat line between steps is the schedule,
          not a dead sensor. Runbook:
          `hosts/jack-sparrow/scrutiny-runbook.md` in the **servers** repo.

  #####################################################################
  # TRENDS — the whole reason Scrutiny exists
  #
  # 30 days, because a sector count that matters moves over weeks. A 24h window
  # (what the NAS view uses for CPU/RAM) would show four flat collector steps
  # and nothing else.
  #####################################################################
  - type: grid
    cards:
      - type: heading
        heading: Trends
        heading_style: title
        icon: mdi:chart-line

      # Flat at zero is the expected shape. Any step up is the alert.
      # `group_by: date` + `func: max` so a single nonzero reading in a day
      # cannot be averaged back down into invisibility.
      - type: custom:mini-graph-card
        name: Reallocated Sectors
        icon: mdi:harddisk-plus
        entities:
          - entity: sensor.scrutiny_reallocated_sectors_total
        hours_to_show: 720
        group_by: date
        aggregate_func: max
        points_per_hour: 0.05
        line_width: 4
        height: 120
        decimals: 0
        animate: true
        show:
          extrema: true
        color_thresholds:
          - value: 0
            color: '#388e3c'
          - value: 1
            color: '#d32f2f'

      - type: custom:mini-graph-card
        name: Hottest Drive
        icon: mdi:thermometer
        entities:
          - entity: sensor.scrutiny_max_drive_temperature
        hours_to_show: 168
        points_per_hour: 0.5
        min_bound_range: 10
        line_width: 4
        height: 120
        decimals: 0
        animate: true
        show:
          extrema: true
        # ⚠️ Fahrenheit — this instance uses US customary units, so HA has
        # already converted ha_scrutiny's native °C. 113 °F (45 °C) is where
        # enterprise drive AFR starts climbing in the BackBlaze data; 122 °F
        # (50 °C) sustained is a cooling problem, not a drive one.
        color_thresholds:
          - value: 86
            color: '#388e3c'
          - value: 104
            color: '#c0ca33'
          - value: 113
            color: '#ffa000'
          - value: 122
            color: '#d32f2f'

      # SUMMARY — the sentence version of this page
      #
      # Still text, on purpose: when something IS wrong the useful output is a
      # sentence naming the drive and its device path, not another coloured
      # square. Three tiles at the top of the page already do the colour.
      #
      # What changed from the first version is the shape, not the content. It
      # was a five-row markdown table, which gave "Pending: 0" exactly as much
      # visual weight as a named failing drive and buried the one line worth
      # reading. This leads with a verdict line, then prints only the
      # supporting detail — and prints the drive-count caveat and the problem
      # list ONLY when they say something.
      #
      # ⚠️ LITERAL BLOCK (`|`), NOT FOLDED (`>-`).
      # A folded scalar joins consecutive lines with spaces, which collapses
      # adjacent list items onto one line and renders the markup as literal
      # text. Blank lines survive folding, so headings and paragraphs look fine
      # and only the lists give it away. Any markdown with tables or adjacent
      # list items needs `|`.
      #
      # card_mod targets `ha-markdown` inside the card's shadow root — styling
      # `ha-card` alone does not reach the rendered markdown. The verdict line
      # is an h3 so it can be selected without wrapping it in a div; markdown
      # cards strip most inline HTML.
      - type: markdown
        grid_options:
          columns: full
          rows: auto
        card_mod:
          style: |
            ha-card {
              border-radius: 14px;
            }
            ha-markdown h3 {
              font-size: 1.05em;
              font-weight: 600;
              margin: 0 0 10px 0;
              padding-bottom: 10px;
              border-bottom: 1px solid var(--divider-color);
            }
            ha-markdown ul {
              margin: 0;
              padding-left: 0;
              list-style: none;
            }
            /* Label / value on one row, value right-aligned and allowed to
               wrap — a serial plus a device path does not fit on a phone. */
            ha-markdown li {
              display: flex;
              justify-content: space-between;
              gap: 16px;
              padding: 5px 0;
              font-size: 0.92em;
            }
            ha-markdown li strong {
              color: var(--secondary-text-color);
              font-weight: 400;
              white-space: nowrap;
            }
            ha-markdown li em {
              font-style: normal;
              text-align: right;
              color: var(--primary-text-color);
            }
            ha-markdown blockquote {
              margin: 12px 0 0 0;
              padding: 10px 12px;
              font-size: 0.86em;
              line-height: 1.45;
              border-left: 3px solid var(--warning-color);
              border-radius: 0 8px 8px 0;
              background: color-mix(in srgb, var(--warning-color) 10%, transparent);
            }
            ha-markdown blockquote p {
              margin: 0;
            }
        content: |
          {%- set h = 'sensor.scrutiny_drive_health' -%}
          {%- set r = 'sensor.scrutiny_reallocated_sectors_total' -%}
          {%- set t = 'sensor.scrutiny_max_drive_temperature' -%}
          {%- set count = state_attr(h, 'drive_count') -%}
          {%- set problems = state_attr(h, 'problems') -%}
          {%- set realloc = states(r) | int(0) -%}
          {%- set pending = state_attr(r, 'pending_total') | int(0) -%}
          {#- The verdict, in three states rather than two.
              `all_clear` deliberately requires the drive count to be right as
              well: seven passing drives out of six present is not an all
              clear, and the status rollup cannot see a missing drive.
              `unknown` is separated out because a rollup that is unavailable —
              Scrutiny down, integration reloading, HA still starting — is not
              a problem with a drive, and showing "Needs a look" for it trains
              you to ignore the one case that matters. -#}
          {%- set unknown = states(h) in ['unknown', 'unavailable']
                            or count is none -%}
          {%- set all_clear = states(h) == 'OK' and realloc == 0
                              and pending == 0 and count == 7 -%}
          ### {% if unknown %}⏳ Waiting on Scrutiny{% elif all_clear %}✅ All drives healthy{% else %}⚠️ Needs a look{% endif %}

          - **Drives seen** — *{{ count if count is not none else '—' }} of 7*
          - **Hottest** — *{{ state_attr(t, 'hottest_drive') or '—' }}*
          - **Reallocated** — *{{ state_attr(r, 'by_drive') or '—' }}*
          - **Pending** — *{{ pending }}{{ ' — sectors flagged, not yet remapped' if pending else '' }}*
          {%- if problems %}
          - **Failing** — *{{ problems }}*
          {%- endif %}
          {%- if count is not none and count != 7 %}

          > **Expected 7 drives, seeing {{ count }}.** 4× Ultrastar (Pool 1),
          > 2× 990 PRO (Pool 2), and the internal 128GB boot SSD. A missing
          > drive does not show up as a failure — it shows up as a smaller
          > count, which is why this line exists.
          {%- endif %}
