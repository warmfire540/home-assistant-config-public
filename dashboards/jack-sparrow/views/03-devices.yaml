---
#####
# DEVICES — the 11 devices the integration registers, one card each
#
# Uses the local custom:device-card (same card as the room views), keyed on
# device_id, so these survive renaming the NAS or its pools in UGOS. Grouped
# by pool to mirror the hardware.
#
# Physical layout:
#   Pool 1 — RAID 5, 4x 12 TB HDD (bays 1-4), tolerates one drive loss
#   Pool 2 — RAID 1, 2x 2 TB NVMe mirror, container/DB state
#
# device_id is opaque, so every card carries an explicit `title:` naming what
# it points at. That is deliberate: the title is both the UI label and the
# only human-readable record of which device the hash is. To re-derive one:
# Settings > Devices, open the device, read the id out of the URL.
#
# Card options in use (see homeassistant-extras/device-card):
#   title:         overrides the registry name, which is the verbose
#                  "jack-sparrow (Pool 1 | Disk 1)" form
#   preview_count: entities shown per section before "Show N more…";
#                  the card default is 3, which collapses almost everything
#   features:
#     hide_device_model  the registry model string double-prints the brand
#                        ("Western Digital Western Digital HGST HUH72…")
#####

title: Devices
path: devices
icon: mdi:devices
type: sections
max_columns: 3
dense_section_placement: true
cards: []
sections:
  - type: grid
    cards:
      - type: heading
        heading: System
        heading_style: title
        icon: mdi:server

      # jack-sparrow
      - type: custom:device-card
        device_id: 9e2d1b012f26e19d47cbbf884dfbab44
        title: jack-sparrow
        preview_count: 8
        features:
          - hide_device_model

  - type: grid
    cards:
      - type: heading
        heading: Pool 1 — RAID 5 bulk
        heading_style: title
        icon: mdi:harddisk

      # Pool 1
      - type: custom:device-card
        device_id: 91cbbc9bf971689b46709966e3236d51
        title: Storage Pool 1
        preview_count: 6
        features:
          - hide_device_model

      # Pool 1 | Disk 1
      - type: custom:device-card
        device_id: eacc2b9877931cf8905d5fb991449738
        title: Disk 1 — bay ata1
        preview_count: 6
        features:
