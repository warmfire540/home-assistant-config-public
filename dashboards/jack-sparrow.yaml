---
#####
# jack-sparrow — UGREEN NASync DXP4800 Pro
#
# Entry point only:
#
#   jack-sparrow.yaml                 this file — title, theme, includes
#   templates/*.yaml                  shared with lab.yaml (see below)
#   jack-sparrow/views/NN-*.yaml      one view per file, ordered by filename
#   cards/portal-row.yaml             shared portal row, `!include`d by every view
#
# `!include` is relative to the including file. `!include_dir_list` sorts by
# filename, hence the NN- prefixes.
#
# Stays at dashboards/jack-sparrow.yaml because `filename:` in
# integrations/lovelace.yaml is only read at startup. Splitting views is a
# page refresh; moving this file is a restart.
#
# Own `button_card_templates:` block because the-matrix pulls templates from
# a HACS-managed dir (custom_components/ui_lovelace_minimalist) that is
# overwritten on UML update.
#
# Adapted from:
#   https://github.com/Tom-Bom-badil/home-assistant_ugreen-nas/wiki/05-The-premade-dashboard-page
#
# 1. `[[[ ... ]]]` JS templates only work inside custom:button-card. A
#    mini-graph-card / tile / entities card that needs a templated entity_id
#    has to nest under a button-card `custom_fields:` wrapper, or the template
#    is passed through as a literal and the card breaks. `ugreen_tpl_host` is
#    that wrapper: single-cell grid plus `variables.slug` / `variables.filter`.
#    Templates one level deeper (inside auto-entities `options:`) need four
#    brackets, `[[[[ ... ]]]]`.
#
# 2. Upstream hardcodes `color: white` for a dark background image. This
#    version uses theme vars so light and dark both work.
#
# 3. YAML anchors do not cross `!include` boundaries. `&percent_thresholds`,
#    `&two_up_grid` and `&disk_card` live in views/01-nas.yaml.
#
# 4. Pools/volumes/disks expose `Size` / `Used` / `Free`, not `Total Size` /
#    `Used Size` / `Available Size`. Wrong names render as em-dashes with no
#    error. Check Developer Tools before assuming the sensor is broken.
#
# 5. A disk the NAS has not finished enumerating reports almost nothing: no
#    Label, Slot, Type or Temperature. Only `Size` and `UGNAS global disk
#    number` are reliable. Every disk field falls back.
#
# Assets under /local/community/ugreen/ ship with the HACS integration and
# live in www/community/, which is gitignored. Absent from this repo, present
# on the live instance.
#
# On integration updates, re-check the upstream wiki. HACS cannot update
# dashboard YAML; merge template/page changes by hand.
#####

# Shared with lab.yaml. Button-card templates are per-dashboard config, so
# both stubs have to include this directory. The three `ugreen_*` templates
# are jack-sparrow's; lab loads them and never calls them.
#
# `!include_dir_merge_named` recurses (os.walk). Keep templates/ flat.
button_card_templates: !include_dir_merge_named templates

title: 'jack-sparrow'
theme: 'minimalist-desktop'

views: !include_dir_list jack-sparrow/views
