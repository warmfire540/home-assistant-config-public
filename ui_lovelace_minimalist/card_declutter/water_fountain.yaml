water_fountain:
  card:
    type: entities
    title: '[[title]]'
    view_layout:
      grid-area: water
    card_mod:
      style: |
        ha-card {
          background: 
            {% if is_state('[[problem_entity]]', 'on') %}
              rgba(var(--color-background-red),var(--opacity-bg))
            {% endif %}
        }
    entities:
      - type: section
        label: Sensors
      - entity: binary_sensor.[[name]]_water_lack_warning
        name: Water Level
      - entity: binary_sensor.[[name]]_replace_filter
        name: Filter Warning
      - entity: sensor.[[name]]_filter_remaining
        name: Filter %

      - type: section
        label: Diagnostic
      - entity: sensor.[[name]]_energy
        name: Energy usage
      - entity: sensor.[[name]]_last_update
        name: Last updated
      - entity: sensor.[[name]]_purified_water
        name: Purified today
      - entity: sensor.[[name]]_last_ble_connection
        name: Last BLE Connection
      - entity: counter.cat_filters
        name: Spare filters
