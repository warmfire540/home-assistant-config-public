#####
# All five Frigate cameras as one Advanced Camera Card grid.
#
# Used by House, Vacation, and the Cameras subview so the set and the
# Frigate menu (clips, recordings, snapshots, timeline) stay in one
# place. Occupancy triggers swap the highlighted camera; motion does not
# (too chatty). PTZ is `auto`: patio and gerbil have motors, the others
# hide the pad.
#
# Live is go2rtc, not HA's stream proxy. Each tile names the `_sub`
# go2rtc stream (patio_sub, gerbil_sub, garage_sub, front_sub,
# living_room_sub) so a 2-up grid does not pull 4K. Single-camera cards
# omit `stream` and get the Frigate camera name, which is the main.
# Mic and talk stay on those single views: they need the main, and HTTPS.
#
# `timeline` / `thumbnails` default to none. The Cameras subview passes
# `below` so review sits under the live grid. House and Vacation stay
# compact.
#
# Call:
#   type: custom:decluttering-card
#   template: frigate_cameras
#   variables:
#     - timeline: below
#     - thumbnails: below
#####
frigate_cameras:
  default:
    - timeline: none
    - thumbnails: none
  card:
    type: custom:advanced-camera-card
    cameras:
      - camera_entity: camera.patio
        live_provider: go2rtc
        go2rtc:
          stream: patio_sub
        triggers: &occupancy_only
          occupancy: true
          motion: false
      - camera_entity: camera.gerbil
        live_provider: go2rtc
        go2rtc:
          stream: gerbil_sub
        triggers: *occupancy_only
      - camera_entity: camera.garage
        live_provider: go2rtc
        go2rtc:
          stream: garage_sub
        triggers: *occupancy_only
      - camera_entity: camera.front
        live_provider: go2rtc
        go2rtc:
          stream: front_sub
        triggers: *occupancy_only
      - camera_entity: camera.living_room
        live_provider: go2rtc
        go2rtc:
          stream: living_room_sub
        triggers: *occupancy_only
    live:
      controls:
        ptz:
          mode: auto
        timeline:
          mode: '[[timeline]]'
        thumbnails:
          mode: '[[thumbnails]]'
      display:
        mode: grid
        grid_columns: 2
    menu:
      buttons:
        clips:
          enabled: true
        recordings:
          enabled: true
        snapshots:
          enabled: true
        timeline:
          enabled: true
        frigate:
          enabled: true
    status_bar:
      style: hover-card
