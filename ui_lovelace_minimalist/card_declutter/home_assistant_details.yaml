home_assistant_details:
  card:
    type: custom:stack-in-card
    keep:
      border_radius: true
      margin: true
    cards:
      # title
      - type: custom:button-card
        name: Home Assistant
        icon: mdi:home-assistant
        show_name: true
        show_entity_picture: true
        styles:
          card:
            - padding: 5px
            - border: 0px
          grid:
            - grid-template-areas: '"n i"'
            - grid-template-columns: 3fr 1fr
          name:
            - justify-self: start
            - padding-left: 20px
            - font-size: 30px
            - font-weight: 300
      # cpu and temp
      - type: horizontal-stack
        cards:
          - type: custom:mini-graph-card
            entities:
              - sensor.processor_use
            hours_to_show: 24
            points_per_hour: 2
            hour24: true
            animate: true
            height: 150
            name: CPU Usage
            show:
              extrema: true
            color_thresholds:
              - value: 100
                color: '#d32f2f'
              - value: 90
                color: '#ffa000'
              - value: 75
                color: '#388e3c'
            card_mod:
              style: |
                ha-card .states.flex{
                  padding-bottom: 0px;
                  }
                ha-card .graph{
                  margin-top: 0px !important;
                }
                ha-card .graph .graph__legend{
                  padding-bottom: 0px !important;
                }
                ha-card .info.flex{
                  padding-bottom: 0px !important;
                }
          - type: custom:mini-graph-card
            entities:
              - sensor.processor_temperature
            hours_to_show: 24
            points_per_hour: 2
            hour24: true
            animate: true
            height: 150
            name: Temp
            show:
              extrema: true
            color_thresholds:
              - value: 170
                color: '#d32f2f'
              - value: 150
                color: '#ffa000'
              - value: 140
                color: '#388e3c'
            card_mod:
              style: |
                ha-card .states.flex{
                  padding-bottom: 0px;
                  }
                ha-card .graph{
                  margin-top: 0px !important;
                }
                ha-card .graph .graph__legend{
                  padding-bottom: 0px !important;
                }
                ha-card .info.flex{
                  padding-bottom: 0px !important;
                }
      # mem and temp
      - type: horizontal-stack
        cards:
          - type: custom:mini-graph-card
            entities:
              - sensor.memory_use_percent
            hours_to_show: 24
            points_per_hour: 2
            hour24: true
            animate: true
            height: 150
            name: Memory
            show:
              extrema: true
            color_thresholds:
              - value: 100
                color: '#d32f2f'
              - value: 90
                color: '#ffa000'
              - value: 75
                color: '#388e3c'
            card_mod:
              style: |
                ha-card .states.flex{
                  padding-bottom: 0px;
                  }
                ha-card .graph{
                  margin-top: 0px !important;
                }
                ha-card .graph .graph__legend{
                  padding-bottom: 0px !important;
                }
                ha-card .info.flex{
                  padding-bottom: 0px !important;
                }
          - type: custom:mini-graph-card
            entities:
              - sensor.disk_use_percent
            hours_to_show: 24
            points_per_hour: 2
            hour24: true
            animate: true
            height: 150
            name: Disk used
            show:
              extrema: true
            color_thresholds:
              - value: 100
                color: '#d32f2f'
              - value: 90
                color: '#ffa000'
              - value: 75
                color: '#388e3c'
            card_mod:
              style: |
                ha-card .states.flex{
                  padding-bottom: 0px;
                  }
                ha-card .graph{
                  margin-top: 0px !important;
                }
                ha-card .graph .graph__legend{
                  padding-bottom: 0px !important;
                }
                ha-card .info.flex{
                  padding-bottom: 0px !important;
                }
      # loads — current 1/5/15m as bars (systemmonitor state, not a
      # `load_*` attribute). Scale 0–4 is four cores; 4.0 is saturated.
      # `soft_bands` + `solid_fill` so each row is one colour, not a
      # rainbow, distinct from the uptime 90–100 bands.
      - type: custom:sensor-bar-card-plus
        layout:
          height: 24
          label:
            position: left
            width: 36
        scale:
          min:
            fixed: 0
          max:
            fixed: 4
        bar:
          fill_style: soft_bands
          segment_space: scale
          solid_fill: true
          segments:
            - from: 0
              to: 1
              color: "#388e3c"
            - from: 1
              to: 2.5
              color: "#ffa000"
            - from: 2.5
              to: 4
              color: "#d32f2f"
        formatting:
          decimal: 2
        entities:
          - entity: sensor.system_monitor_load_1m
            name: 1m
            icon: false
          - entity: sensor.system_monitor_load_5m
            name: 5m
            icon: false
          - entity: sensor.system_monitor_load_15m
            name: 15m
            icon: false
      # up / down
      - type: custom:mini-graph-card
        entities:
          - entity: sensor.system_monitor_network_throughput_in_end0
            color: '#91C0F8'
            name: Download
          - entity: sensor.system_monitor_network_throughput_out_end0
            color: '#ffa000'
            name: Upload
            show_state: true
        hours_to_show: 24
        points_per_hour: 2
        height: 75
        animate: true
        line_width: 2.5
        show:
          name: false
          icon: false
        card_mod:
          style: |
            ha-card .graph{
              margin-top: -15px !important;
            }
            ha-card .graph .graph__legend{
              padding-bottom: 0px !important;
            }
      # other and fold
      - type: entities
        entities:
          - entity: sensor.last_boot
            name: Uptime
            icon: mdi:clock-outline
          - entity: update.home_assistant_core_update
            name: Core Update
          - entity: update.home_assistant_supervisor_update
            name: Supervisor Update
          - entity: update.home_assistant_operating_system_update
            name: OS Update
          - type: custom:fold-entity-row
            head:
              type: section
              label: Server Details
            card_mod:
              style:
                hui-sensor-entity-row:
                  $ hui-generic-entity-row $: |
                    .pointer{
                      color: #91C0F8;
                    }
                    .text-content{
                      color: #e1e1e1;
                    }
                hui-simple-entity-row:
                  $ hui-generic-entity-row $: |
                    .pointer{
                      color: #91C0F8;
                    }
                    .text-content{
                      color: #e1e1e1;
                    }
            entities:
              - type: attribute
                entity: device_tracker.homeassistant_wired
                name: Hostname
                attribute: host_name
              - entity: sensor.ipv4_address_end0
                name: IP Address
              - entity: sensor.disk_use_percent
                name: Storage
              - type: attribute
                entity: update.home_assistant_operating_system_update
                name: OS
                attribute: title
              - type: attribute
                entity: update.home_assistant_operating_system_update
                name: OS Version
                attribute: installed_version
        card_mod:
          style:
            hui-sensor-entity-row:
              $ hui-generic-entity-row $: |
                .pointer{
                  color: #91C0F8;
                }
                .text-content{
                  color: #e1e1e1;
                }
