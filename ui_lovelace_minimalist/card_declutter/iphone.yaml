#####
# Glanceable phone row for House. Battery, where it is, how it is
# connected, then a fold for the rest. The template used to dump every
# companion sensor and hardcode `grid-area: poat-phone`, which left
# Gina's card untitled and unstacked.
#
# Call:
#   type: custom:decluttering-card
#   template: iphone
#   variables:
#     - name: Poat
#     - phone: poat_s_iphone_14_pro_max
#####
iphone:
  card:
    type: entities
    title: "[[name]]'s iPhone"
    entities:
      - entity: sensor.[[phone]]_battery_level
        name: Battery
      - entity: sensor.[[phone]]_battery_state
        name: Charge
      - entity: sensor.[[phone]]_geocoded_location
        name: Location
      - entity: sensor.[[phone]]_connection_type
        name: Connection
      - entity: device_tracker.[[phone]]_2
        name: Tracker
      - type: custom:fold-entity-row
        open: false
        head:
          type: section
          label: More
        entities:
          - entity: sensor.[[phone]]_activity
            name: Activity
          - entity: sensor.[[phone]]_average_active_pace
            name: Average pace
          - entity: sensor.[[phone]]_bssid
            name: BSSID
          - entity: sensor.[[phone]]_ssid
            name: SSID
          - entity: sensor.[[phone]]_distance
            name: Distance
          - entity: binary_sensor.[[phone]]_focus
            name: Focus
          - entity: sensor.[[phone]]_last_update_trigger
            name: Last update
          - entity: sensor.[[phone]]_location_permission
            name: Location permission
          - entity: sensor.[[phone]]_steps
            name: Steps
          - entity: sensor.[[phone]]_storage
            name: Storage
          - entity: sensor.[[phone]]_watch_battery
            name: Watch battery
          - entity: sensor.[[phone]]_app_version
            name: App version
