#####
# One Frigate camera: live view, clips/recordings, occupancy.
#
# `camera` is the Frigate key and the HA object_id (patio, gerbil,
# garage, front). Live is go2rtc with no `stream`, so the card uses the
# Frigate camera name — the main. That is what patio/gerbil PTZ and the
# mic need (mic also needs HTTPS). The grid template uses `_sub` instead.
#
# `occupancy` is an auto-entities entity_id regex. Default matches
# nothing, so patio and garage show no occupancy chips. Pass one only
# for the entities the Frigate plan keeps:
#   gerbil — person + cat + rodent
#   front  — person + package on front_door, pavers, and sidewalk
#            (the walkway). Door-package's entity_id is
#            home_front_door_package_occupancy; the registry unique_id
#            is front_door_package. Sidewalk package is
#            sidewalk_package_occupancy.
# living_room detect is on (cat only) but it has no HA occupancy
# entities, so it stays a live-only card in the living-room view, not
# this template. `_all_occupancy` and `_motion` stay out either way.
#
# Missing matches hide (`show_empty: false`).
#
# No backslashes in `occupancy`: decluttering pastes variables into
# the card's JSON text, so `\.` becomes an invalid JSON escape and the
# whole card is "Configuration error". Match a literal dot with `[.]`.
#
# Call:
#   type: custom:decluttering-card
#   template: frigate_camera
#   variables:
#     - camera: gerbil
#     - occupancy: '/^binary_sensor[.]gerbil_(person|cat|rodent)_occupancy$/'
#####
frigate_camera:
  default:
    - occupancy: '/^$/'
  card:
    type: vertical-stack
    cards:
      - type: custom:advanced-camera-card
        cameras:
          - camera_entity: camera.[[camera]]
            live_provider: go2rtc
            triggers:
              occupancy: true
              motion: false
        live:
          controls:
            ptz:
              mode: auto
        menu:
          buttons:
            clips:
              enabled: true
            recordings:
              enabled: true
            snapshots:
              enabled: true
            timeline:
              enabled: true
            frigate:
              enabled: true
        status_bar:
          style: hover-card

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - entity_id: '[[occupancy]]'
              options:
                type: custom:button-card
                template: card_binary_sensor
        sort:
          method: name
