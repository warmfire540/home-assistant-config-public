title: Home
path: home
type: custom:grid-layout
layout:
  grid-template-areas: |
    "banner banner"
    "welcome people"
    "rooms rooms"
  mediaquery:
    '(max-width: 768px)':
      grid-template-areas: |
        "banner"
        "welcome"
        "people"
        "rooms"
cards:
  #################
  # VACATION MODE BANNER
  #################
  - type: conditional
    conditions:
      - entity: input_boolean.on_vacation
        state: 'on'
    card:
      type: custom:button-card
      view_layout:
        grid-area: banner
      name: '🏖️ VACATION MODE ACTIVE'
      styles:
        card:
          - background-color: 'rgba(255, 193, 7, 0.2)'
          - border: '2px solid #ffc107'
          - border-radius: '10px'
          - padding: '10px'
        name:
          - color: '#ff6b35'
          - font-size: '18px'
          - font-weight: 'bold'
          - text-transform: 'uppercase'

  #################
  # STATUS CHIPS
  #################
  - type: custom:toolbar-status-chips

  #################
  # WELCOME
  #################
  - type: custom:button-card
    template: card_welcome
    view_layout:
      grid-area: welcome

  #################
  # PEOPLE
  #################
  - type: vertical-stack
    view_layout:
      grid-area: people
    cards:
      - type: custom:button-card
        template: card_family
        variables:
          person: poat
      - type: custom:button-card
        template: card_family
        variables:
          person: gina

  #############
  # ROOM CARDS
  #############
  - type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      # desktop screen
      grid-template-columns: repeat(6, 1fr)
      grid-template-rows: auto
      grid-template-areas: |
        "label label label label label label"
        "living dining office kitchen bedroom bath"
        "guest spare garage attic shed server"
        "patio . . . . ."
      mediaquery:
        # portrait monitor
        'only screen and (min-width: 769px) and (max-width: 1400px)':
          grid-template-columns: repeat(4, 1fr)
          grid-template-areas: |
            "label label label label"
            "living dining office kitchen "
            "bedroom bath guest spare"
            "garage attic shed server"
            "patio . . ."
        # Smartphones
        'only screen and (max-width: 768px)':
          grid-template-columns: 1fr 1fr
          grid-template-areas: |
            "label label"
            "living dining"
            "office kitchen"
            "bedroom bath"
            "guest spare"
            "garage attic"
            "shed server"
            "patio ."
    view_layout:
      grid-area: rooms
    cards:
      - type: custom:button-card
        template: card_title
        name: Rooms
        variables:
          grid-area: label

      #################
      # LIVING ROOM
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: living
        area: living_room
        entity:
          entity_id: camera.living_room
          styles:
            '--opacity-icon-fill-inactive': 1
        entities:
          - switch.sconce
          - climate.living_room
        features:
          - multi_light_background
        lights:
          - light.living_room_light
          - switch.sconce

      #################
      # DINING ROOM
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: dining
        area: dining_room
        entities:
          - media_player.living_room_tv

      #################
      # OFFICE
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: office
        area: office
        features:
          - multi_light_background
        lights:
          - light.office_light
        entity:
          entity_id: camera.gerbil
          styles:
            '--opacity-icon-fill-inactive': 1
        entities:
          - entity_id: binary_sensor.office_door_window_door_is_open
            off_color: green
            on_color: red
          - media_player.office_tv

      #################
      # KITCHEN
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: kitchen
        area: kitchen
        entities:
          - switch.under_cabinet_lights
          - light.dinette_light
        features:
          - multi_light_background
        lights:
          - light.kitchen_light
          - switch.under_cabinet_lights
          - light.dinette_light

      #################
      # MASTER BEDROOM
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: bedroom
        area: master_bedroom

      #################
      # MASTER BATHROOM
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: bath
        area: master_bath
        entities:
          - switch.master_bath_shower_light

      #################
      # GUEST ROOM
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: guest
        area: guest_bedroom
        entities:
          - switch.water_softener_plug
        background:
          image_entity: person.gina
          options:
            - icon_background

      #################
      # GUEST BATHROOM
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: spare
        area: guest_bath

      #################
      # GARAGE
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: garage
        area: garage
        entity:
          entity_id: camera.garage
          styles:
            '--opacity-icon-fill-inactive': 1
        thresholds:
          temperature:
            - value: 90
        entities:
          - entity_id: binary_sensor.garage_door_tilt_window_door_is_open
            tap_action:
              action: call-service
              service: switch.toggle
              service_data:
                entity_id: switch.garage_opener
          - switch.garage_opener_plug
          - switch.water_valve

      #################
      # ATTIC
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: attic
        area: attic
        thresholds:
          temperature:
            - value: 100
        entity:
          entity_id: camera.front
          styles:
            '--opacity-icon-fill-inactive': 1

      #################
      # SHED
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: shed
        area: shed
        thresholds:
          temperature:
            - value: 90
          humidity:
            - value: 70
        entities:
          - binary_sensor.shed_door_sensor_open

      #################
      # SERVER CLOSET
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: server
        area: server_closet
        humidity_sensor: sensor.office_climate_humidity
        temperature_sensor: sensor.office_climate_air_temperature
        navigate: lab
        background:
          options:
            - icon_background

      #################
      # Patio
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: patio
        area: patio
        entity:
          entity_id: camera.patio
          styles:
            '--opacity-icon-fill-inactive': 1
