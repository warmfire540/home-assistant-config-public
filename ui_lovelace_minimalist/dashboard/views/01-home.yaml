title: Home
path: home
type: custom:grid-layout
layout:
  grid-template-areas: |
    "banner banner"
    "welcome people"
    "rooms rooms"
  mediaquery:
    '(max-width: 768px)':
      grid-template-areas: |
        "banner"
        "welcome"
        "people"
        "rooms"
cards:
  #################
  # VACATION MODE BANNER
  #################
  - type: conditional
    conditions:
      - entity: input_boolean.on_vacation
        state: 'on'
    card:
      type: custom:button-card
      view_layout:
        grid-area: banner
      name: '🏖️ VACATION MODE ACTIVE'
      styles:
        card:
          - background-color: 'rgba(255, 193, 7, 0.2)'
          - border: '2px solid #ffc107'
          - border-radius: '10px'
          - padding: '10px'
        name:
          - color: '#ff6b35'
          - font-size: '18px'
          - font-weight: 'bold'
          - text-transform: 'uppercase'

  #################
  # STATUS CHIPS
  #################
  - type: custom:toolbar-status-chips

  #################
  # WELCOME
  #################
  - type: custom:button-card
    template: card_welcome
    view_layout:
      grid-area: welcome

  #################
  # PEOPLE
  #################
  - type: vertical-stack
    view_layout:
      grid-area: people
    cards:
      - type: custom:button-card
        template: card_family
        variables:
          person: poat
      - type: custom:button-card
        template: card_family
        variables:
          person: gina

  #############
  # ROOM CARDS
  #############
  - type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      # desktop screen
      grid-template-columns: repeat(6, 1fr)
      grid-template-rows: auto
      grid-template-areas: |
        "label label label label label label"
        "living dining office kitchen bedroom bath"
        "guest spare garage attic shed server"
        "patio nas . . . ."
      mediaquery:
        # portrait monitor
        'only screen and (min-width: 769px) and (max-width: 1400px)':
          grid-template-columns: repeat(4, 1fr)
          grid-template-areas: |
            "label label label label"
            "living dining office kitchen "
            "bedroom bath guest spare"
            "garage attic shed server"
            "patio nas . ."
        # Smartphones
        'only screen and (max-width: 768px)':
          grid-template-columns: 1fr 1fr
          grid-template-areas: |
            "label label"
            "living dining"
            "office kitchen"
            "bedroom bath"
            "guest spare"
            "garage attic"
            "shed server"
            "patio nas"
    view_layout:
      grid-area: rooms
    cards:
      - type: custom:button-card
        template: card_title
        name: Rooms
        variables:
          grid-area: label

      #################
      # LIVING ROOM
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: living
        area: living_room
        entity:
          entity_id: camera.living_room
          double_tap_action:
            action: more-info
          styles:
            '--opacity-icon-fill-inactive': 1
        entities:
          - switch.sconce
          - climate.living_room
          - media_player.living_room_tv
        features:
          - multi_light_background
        lights:
          - light.living_room_light
          - switch.sconce

      #################
      # DINING ROOM
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: dining
        area: dining_room
        background:
          image_entity: person.gina

      #################
      # OFFICE
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: office
        area: office
        features:
          - multi_light_background
        lights:
          - light.office_light
        entity:
          entity_id: camera.gerbil
          double_tap_action:
            action: more-info
          styles:
            '--opacity-icon-fill-inactive': 1
        entities:
          - entity_id: binary_sensor.office_door_window_door_is_open
            off_color: green
            on_color: red
          - entity_id: binary_sensor.gerbil_cat_occupancy
          - media_player.office_tv

      #################
      # KITCHEN
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: kitchen
        area: kitchen
        entities:
          - switch.under_cabinet_lights
          - light.dinette_light
        features:
          - multi_light_background
        lights:
          - light.kitchen_light
          - switch.under_cabinet_lights
          - light.dinette_light

      #################
      # MASTER BEDROOM
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: bedroom
        area: master_bedroom

      #################
      # MASTER BATHROOM
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: bath
        area: master_bath
        entities:
          - switch.master_bath_shower_light

      #################
      # GUEST ROOM
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: guest
        area: guest_bedroom
        entities:
          - switch.water_softener_plug
        background:
          image_entity: person.gina
          options:
            - icon_background

      #################
      # GUEST BATHROOM
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: spare
        area: guest_bath
        background:
          image_entity: person.gina
          options:
            - icon_background
            - hide_icon_only

      #################
      # GARAGE
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: garage
        area: garage
        entity:
          entity_id: camera.garage
          double_tap_action:
            action: more-info
          styles:
            '--opacity-icon-fill-inactive': 1
        thresholds:
          temperature:
            - value: 90
        entities:
          - entity_id: binary_sensor.garage_door_tilt_window_door_is_open
            tap_action:
              action: call-service
              service: switch.toggle
              service_data:
                entity_id: switch.garage_opener
          - entity_id: binary_sensor.garage_door_person_occupancy
          - switch.garage_opener_plug
          - switch.water_valve

      #################
      # ATTIC
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: attic
        area: attic
        thresholds:
          temperature:
            - value: 100
        entity:
          entity_id: camera.front
          double_tap_action:
            action: more-info
          styles:
            '--opacity-icon-fill-inactive': 1
        entities:
          - entity_id: binary_sensor.front_door_person_occupancy

      #################
      # SHED
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: shed
        area: shed
        thresholds:
          temperature:
            - value: 90
          humidity:
            - value: 70
        entities:
          - binary_sensor.shed_door_sensor_open

      #################
      # SERVER CLOSET
      #################
      # Taps anywhere on the card -> the standalone lab dashboard.
      # Root-level `navigate:` is deprecated on this card (same pattern as
      # jack-sparrow below). Lands on Uptime; Pi-hole and Z-Wave are tabs.
      - type: custom:room-summary-card
        view_layout:
          grid-area: server
        area: server_closet
        humidity_sensor: sensor.office_climate_humidity
        temperature_sensor: sensor.office_climate_air_temperature
        actions:
          tap_action:
            action: navigate
            navigation_path: /home-lab/uptime
        background:
          options:
            - icon_background

      #################
      # JACK-SPARROW (NAS)
      #################
      # Taps anywhere on the card -> the standalone jack-sparrow dashboard.
      # `full_card_actions` is what makes the whole card (not just the title)
      # honour tap_action; root-level `navigate:` is deprecated on this card.
      - type: custom:room-summary-card
        view_layout:
          grid-area: nas
        area: jack_sparrow
        area_name: jack-sparrow
        actions:
          tap_action:
            action: navigate
            navigation_path: /jack-sparrow/nas
        # Rolled-up health drives the icon colour: red if ANY pool, volume or
        # disk is not "Normal". Defined in entities/templates/jack_sparrow.yaml.
        entity:
          entity_id: sensor.jack_sparrow_health
          tap_action:
            action: more-info
        temperature_sensor: sensor.jack_sparrow_cpu_temperature
        entities:
          # Pool 1 = RAID 5 bulk, single-drive tolerance. The one that matters.
          - entity_id: sensor.jack_sparrow_pool_1_status
            tap_action:
              action: more-info
          # Capacity trend on the bulk array.
          - entity_id: sensor.jack_sparrow_pool_1_volume_1_used
            tap_action:
              action: more-info
          # Pool 2 = NVMe mirror holding container/DB state.
          - entity_id: sensor.jack_sparrow_pool_2_status
            tap_action:
              action: more-info

      #################
      # Patio
      #################
      - type: custom:room-summary-card
        view_layout:
          grid-area: patio
        area: patio
        entity:
          entity_id: camera.patio
          double_tap_action:
            action: more-info
          styles:
            '--opacity-icon-fill-inactive': 1
        entities:
          - entity_id: binary_sensor.patio_area_person_occupancy
