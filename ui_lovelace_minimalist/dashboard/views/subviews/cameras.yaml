title: 'Cameras'
path: 'cameras'
subview: true
type: custom:grid-layout
cards:
  - type: custom:auto-entities
    show_empty: false
    card:
      type: grid
      columns: 2
      square: false
    card_param: cards
    filter:
      include:
        - domain: camera
          options:
            type: custom:advanced-camera-card
            cameras:
              - camera_entity: this.entity_id
            status_bar:
              style: hover-card
      exclude:
        - entity_category: config
        - entity_category: diagnostic
    sort:
      method: name
