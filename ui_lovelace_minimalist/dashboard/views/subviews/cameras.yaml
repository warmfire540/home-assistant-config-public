#####
# Cameras subview. Reached from the Home welcome pill (replaced the
# unused Lights view). Live grid of the five Frigate cameras, then
# occupancy that is worth acting on. Clips / recordings / timeline live
# on the Advanced Camera Card menu (same card as House and Vacation, with
# timeline and thumbnails turned on here).
#
# Occupancy is the HA entities the Frigate plan keeps: front person +
# package on the door zones (front_door, pavers), and gerbil person +
# cat. Patio, garage, and living_room contribute no occupancy tiles.
# living_room detect stays on (cat only); that history is in Frigate,
# not an HA entity. Garage door state is not an entity yet.
#
# The Frigate UI itself is the portal-row button on lab / jack-sparrow.
#
# Width: default `1fr` is `minmax(auto, 1fr)`. The Advanced Camera Card's
# intrinsic width is the stream (1440p) times its own 2-col grid, so the
# page grew to ~15k px. `minmax(0, 1fr)` lets the column shrink to the
# Lovelace panel. One column: every block already spanned both cells.
#####
title: Cameras
path: cameras
subview: true
type: custom:grid-layout
layout:
  width: 100%
  max_width: 1400px
  grid-template-columns: minmax(0, 1fr)
  grid-template-areas: |
    "header"
    "live"
    "occupancy"
  mediaquery:
    'only screen and (min-width: 769px) and (max-width: 1400px)':
      grid-template-columns: minmax(0, 1fr)
      grid-template-areas: |
        "header"
        "live"
        "occupancy"
    'only screen and (max-width: 768px)':
      grid-template-columns: minmax(0, 1fr)
      grid-template-areas: |
        "header"
        "live"
        "occupancy"
cards:
  #################
  # HEADER
  #################
  - type: custom:button-card
    template: mainview_header
    view_layout:
      grid-area: header
    variables:
      area: home
      status_path: 'no'

  #################
  # LIVE
  #################
  - type: vertical-stack
    view_layout:
      grid-area: live
    cards:
      - type: custom:button-card
        template: card_title
        label: Live

      - type: custom:decluttering-card
        template: frigate_cameras
        variables:
          - timeline: below
          - thumbnails: below

  #################
  # OCCUPANCY
  #################
  - type: vertical-stack
    view_layout:
      grid-area: occupancy
    cards:
      - type: custom:button-card
        template: card_title
        label: Occupancy

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - entity_id: '/^binary_sensor\.(front_door_person_occupancy|home_front_door_package_occupancy|pavers_person_occupancy|pavers_package_occupancy|gerbil_person_occupancy|gerbil_cat_occupancy)$/'
              options:
                type: custom:button-card
                template: card_binary_sensor
        sort:
          method: name
