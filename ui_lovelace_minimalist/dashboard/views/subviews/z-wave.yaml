title: 'Z-Wave'
path: 'z-wave'
subview: true
type: custom:grid-layout
layout:
  grid-template-areas: |
    ". header ."
    "health nodes nodes"
  mediaquery:
    # portrait monitor
    'only screen and (min-width: 769px) and (max-width: 1400px)':
      grid-template-areas: |
        "header"
        "health"
        "nodes ."
    # Smartphones
    'only screen and (max-width: 768px)':
      grid-template-areas: |
        "header"
        "nodes"
        "health"
      grid-template-columns: repeat(3, 1fr)
cards:
  #################
  # HEADER
  #################
  - type: custom:button-card
    template: subview_header
    view_layout:
      grid-area: header
    variables:
      image: /local/img/z-wave.png
      image_nav: /config/integrations/integration/zwave_js

  #################
  # NODES
  #################
  - type: vertical-stack
    view_layout:
      grid-area: nodes
    cards:
      - type: custom:zooz-nodes-status
        columns: 2
        features:
          - compact

  #################
  # DEVICE HEALTH
  #################
  - type: vertical-stack
    view_layout:
      grid-area: health
    cards:
      - type: custom:zooz-device-center
