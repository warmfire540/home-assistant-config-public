title: 'Z-Wave'
path: 'z-wave'
subview: true
type: custom:grid-layout
layout:
  grid-template-areas: |
    "nodes nodes health"
  mediaquery:
    # portrait monitor
    'only screen and (min-width: 769px) and (max-width: 1400px)':
      grid-template-areas: |
        "nodes health"
    # Smartphones
    'only screen and (max-width: 768px)':
      grid-template-areas: |
        "nodes"
        "health"
cards:
  #################
  # DEVICE HEALTH
  #################
  - type: custom:zwave-device-center
    view_layout:
      grid-area: health

  #################
  # NODES
  #################
  - type: custom:state-switch
    entity: mediaquery
    view_layout:
      grid-area: nodes
    states:
      '(min-width: 1400px)':
        type: custom:zwave-nodes-status
        columns: 2
        features:
          - compact
      'all':
        type: custom:zwave-nodes-status
        columns: 1
        features:
          - compact
