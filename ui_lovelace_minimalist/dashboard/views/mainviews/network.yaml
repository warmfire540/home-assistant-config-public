---
#####
# Network — WAN, Wi-Fi, and device presence.
#
# Disconnected is the page. The exclude list is load-bearing: it matches
# entities that are expected-offline (or never "a device"). Do not tidy
# it for symmetry with other views.
#
# WAN is the gateway eero (pretty_fly) plus an on-demand Speedtest.
# Per-node daily usage sits under that. Per-second upload/download rate
# graphs were the same traffic twice and are gone. Wi-Fi is the sorted
# list, not a graph of the same sensors.
#####
title: 'Network'
path: 'network'
subview: true
type: custom:grid-layout
layout:
  grid-template-areas: |
    "wan disconnected updates"
    "wan disconnected connected"
    "wifi disconnected connected"
  mediaquery:
    # portrait monitor
    'only screen and (min-width: 769px) and (max-width: 1400px)':
      grid-template-areas: |
        "wan disconnected"
        "wan updates"
        "wifi connected"
    # Smartphones
    'only screen and (max-width: 768px)':
      grid-template-areas: |
        "wan"
        "wifi"
        "disconnected"
        "updates"
        "connected"
cards:
  #################
  # HEADER
  #################
  - type: custom:button-card
    template: mainview_header

  #################
  # WAN
  #################
  - type: vertical-stack
    view_layout:
      grid-area: wan
    cards:
      - type: 'custom:button-card'
        template: card_title
        label: WAN

      - type: 'custom:mini-graph-card'
        name: Gateway
        icon: mdi:wan
        show:
          extrema: true
        entities:
          - entity: sensor.pretty_fly_for_a_wifi_download_speed
            name: Download
          - entity: sensor.pretty_fly_for_a_wifi_upload_speed
            name: Upload

      - type: custom:mini-graph-card
        name: Speedtest
        align_state: center
        icon: mdi:speedometer
        show:
          extrema: true
          labels: true
        entities:
          - entity: sensor.speedtest_download
            name: Download
            color: green
          - entity: sensor.speedtest_upload
            name: Upload
            color: red
          - entity: sensor.speedtest_ping
            name: Ping
            color: yellow
        tap_action:
          action: 'call-service'
          service: 'homeassistant.update_entity'
          service_data:
            entity_id:
              - sensor.speedtest_download
              - sensor.speedtest_upload
              - sensor.speedtest_ping

      - type: custom:auto-entities
        card:
          type: 'custom:mini-graph-card'
          name: Usage per day
          icon: mdi:chart-bar
          show:
            legend: false
            extrema: true
            fill: false
        filter:
          include:
            - entity_id: 'sensor.*_data_usage_day'

  #################
  # WI-FI
  #################
  - type: vertical-stack
    view_layout:
      grid-area: wifi
    cards:
      - type: 'custom:button-card'
        template: card_title
        label: Wi-Fi

      - type: custom:auto-entities
        card:
          type: entities
          state_color: true
        filter:
          include:
            - attributes:
                device_class: signal_strength
        sort:
          method: state
          numeric: true
          reverse: true

  #################
  # DISCONNECTED
  #################
  - type: vertical-stack
    view_layout:
      grid-area: disconnected
    cards:
      - type: 'custom:anchor-card'
        anchor_id: disconnected
        timeout: 500
        offset: -50

      - type: 'custom:button-card'
        template: card_title
        label: Disconnected Devices

      - type: custom:auto-entities
        card:
          type: entities
        else:
          type: markdown
          content: >-
            <ha-alert alert-type="info">Nothing disconnected!</ha-alert>
        filter:
          include:
            - state: 'unavailable'
              options:
                show_state: false
            - state: 'unknown'
              options:
                show_state: false
          exclude:
            - entity_id: '*seedbox*'
            - entity_id: '*mfc_7860*'
            - entity_id: '*poat_plex*'
            - entity_id: '*xbox_x*'
            - entity_id: '*ipad*'
            - domain: automation
            - domain: button
            - domain: number
            - domain: conversation
            - domain: script
            - domain: select
            - domain: stt
            - domain: tts
            - integration: cast
            - label: offline

  #################
  # UPDATES
  #################
  - type: vertical-stack
    view_layout:
      grid-area: updates
    cards:
      - type: 'custom:anchor-card'
        anchor_id: updates
        timeout: 500
        offset: -50

      - type: 'custom:button-card'
        template: card_title
        label: Updates needed

      - type: custom:auto-entities
        card:
          type: entities
        else:
          type: markdown
          content: >-
            <ha-alert alert-type="info">No updates!</ha-alert>
        filter:
          include:
            - domain: update
              state: 'on'

  #################
  # CONNECTED
  #################
  - type: vertical-stack
    view_layout:
      grid-area: connected
    cards:
      - type: 'custom:button-card'
        template: card_title
        label: Connected Devices

      - type: custom:auto-entities
        card:
          type: entities
        filter:
          include:
            - domain: device_tracker
              attributes:
                source_type: router
              options:
                secondary: >-
                  {{ ('Unknown' if states[config.entity] is none else as_timestamp(states[config.entity].last_changed, 0) | timestamp_custom('%b %d %H:%M - ')) +
                  states(config.entity) + ' ' +
                    iif(
                      state_attr(config.entity, "connection_type"),
                      state_attr(config.entity, "connection_type"),
                      ''
                      )}}
                state: '{{ state_attr(config.entity, "ip") }}'
                type: 'custom:template-entity-row'
        sort:
          method: attribute
          attribute: ip
          reverse: true
          ip: true
