title: 'Cats'
path: 'cats'
subview: true
type: custom:grid-layout
layout:
  grid-template-areas: |
    "chonk chonk chonk chonk"
    "water1 water2 trail noms"
  mediaquery:
    # portrait monitor
    'only screen and (min-width: 769px) and (max-width: 1400px)':
      grid-template-areas: |
        "chonk chonk"
        "feeder-title ."
        "water1 water2"
        "trail noms"
    # Smartphones
    'only screen and (max-width: 768px)':
      grid-template-areas: |
        "chonk"
        "feeder-title"
        "water1"
        "water2"
        "trail"
        "noms"
cards:
  #################
  # HEADER
  #################
  - type: custom:button-card
    template: mainview_header

  - type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      # desktop screen
      grid-template-columns: repeat(4, 1fr)
      grid-template-areas: |
        "laggy ellie tp marbs"
      mediaquery:
        # portrait monitor
        'only screen and (min-width: 769px) and (max-width: 1400px)':
          grid-template-areas: |
            "laggy ellie tp marbs"
        # Smartphones
        'only screen and (max-width: 768px)':
          grid-template-columns: repeat(2, 1fr)
          grid-template-areas: |
            "laggy ellie"
            "tp marbs"
    view_layout:
      grid-area: chonk
    cards:
      - type: custom:device-card
        device_id: 9c08f9a7ab71aed0e39a5a12c22faf5f
        features:
          - entity_picture
        view_layout:
          grid-area: laggy
      - type: custom:device-card
        device_id: ba65b4640b38764e0b6decefb4163ffd
        features:
          - entity_picture
        view_layout:
          grid-area: ellie
      - type: custom:device-card
        device_id: 2a3c1f7c07c687fe0b46fca7d42772bb
        features:
          - entity_picture
        view_layout:
          grid-area: tp
      - type: custom:device-card
        device_id: 65826b6406187cf819e9326412733d57
        features:
          - entity_picture
        view_layout:
          grid-area: marbs

  - type: 'custom:button-card'
    template: card_title
    label: Feeders
    view_layout:
      grid-area: feeder-title

  - type: custom:petkit-device
    device_id: db3f2afaa7807e64861e138e222c3fd4
    view_layout:
      grid-area: water1

  - type: custom:petkit-device
    device_id: ae4397233b426e4800920907d87b6a14
    view_layout:
      grid-area: water2

  - type: custom:petkit-device
    device_id: e9197877ed314b17e242e4aec2624ffe
    view_layout:
      grid-area: trail

  - type: custom:petkit-device
    device_id: 5e292fbf1ccd67f04a5468483bba2c76
    view_layout:
      grid-area: noms
