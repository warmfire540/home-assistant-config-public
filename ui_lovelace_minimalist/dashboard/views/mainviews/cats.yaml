title: 'Cats'
path: 'cats'
subview: true
type: custom:grid-layout
layout:
  grid-template-areas: |
    "chonk-title . . ."
    ". chonk chonk ."
    "water1 water2 trail noms"
  mediaquery:
    # portrait monitor
    'only screen and (min-width: 769px) and (max-width: 1400px)':
      grid-template-areas: |
        "chonk-title ."
        "chonk chonk"
        "feeder-title ."
        "water1 water2"
        "trail noms"
    # Smartphones
    'only screen and (max-width: 768px)':
      grid-template-areas: |
        "chonk-title"
        "chonk"
        "feeder-title"
        "water1"
        "water2"
        "trail"
        "noms"
cards:
  #################
  # HEADER
  #################
  - type: custom:button-card
    template: mainview_header

  - type: 'custom:button-card'
    template: card_title
    label: Chonk
    view_layout:
      grid-area: chonk-title

  - type: vertical-stack
    view_layout:
      grid-area: chonk
    cards:
      - type: horizontal-stack
        cards:
          - type: 'custom:button-card'
            name: Lags
            entity: sensor.lagertha_last_use_date
            entity_picture: "[[[ return states['sensor.lagertha_last_use_date'].attributes.entity_picture; ]]]"
            layout: name_state
            show_entity_picture: true
            show_state: false
          - type: 'custom:button-card'
            name: Ellie
            entity: sensor.ellie_last_use_date
            entity_picture: "[[[ return states['sensor.ellie_last_use_date'].attributes.entity_picture; ]]]"
            layout: name_state
            show_entity_picture: true
            show_state: false

      - type: horizontal-stack
        cards:
          - type: 'custom:button-card'
            name: TP
            entity: sensor.the_punisher_last_use_date
            entity_picture: "[[[ return states['sensor.the_punisher_last_use_date'].attributes.entity_picture; ]]]"
            layout: name_state
            show_entity_picture: true
            show_state: false
          - type: 'custom:button-card'
            name: Marbles
            entity: sensor.marbles_last_use_date
            entity_picture: "[[[ return states['sensor.marbles_last_use_date'].attributes.entity_picture; ]]]"
            layout: name_state
            show_entity_picture: true
            show_state: false

  - type: 'custom:button-card'
    template: card_title
    label: Feeders
    view_layout:
      grid-area: feeder-title

  - type: custom:petkit-device
    device_id: db3f2afaa7807e64861e138e222c3fd4
    view_layout:
      grid-area: water1

  - type: custom:petkit-device
    device_id: ae4397233b426e4800920907d87b6a14
    view_layout:
      grid-area: water2

  - type: custom:petkit-device
    device_id: e9197877ed314b17e242e4aec2624ffe
    view_layout:
      grid-area: trail

  - type: custom:petkit-device
    device_id: 5e292fbf1ccd67f04a5468483bba2c76
    view_layout:
      grid-area: noms
