title: 'Cats'
path: 'cats'
subview: true
type: custom:grid-layout
layout:
  grid-template-areas: |
    "chonk chonk chonk chonk"
    "water1 water2 trail noms"
    ". shit1 shit2 ."
  mediaquery:
    # portrait monitor
    'only screen and (min-width: 769px) and (max-width: 1400px)':
      grid-template-areas: |
        "chonk chonk"
        "feeder-title ."
        "water1 water2"
        "trail noms"
        "shit1 shit2"
    # Smartphones
    'only screen and (max-width: 768px)':
      grid-template-areas: |
        "chonk"
        "feeder-title"
        "water1"
        "water2"
        "trail"
        "noms"
        "shit1"
        "shit2"
cards:
  #################
  # HEADER
  #################
  - type: custom:button-card
    template: mainview_header

  - type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      # desktop screen
      grid-template-columns: repeat(4, 1fr)
      grid-template-areas: |
        "laggy ellie tp marbs"
        ". selector selector ."
      mediaquery:
        # portrait monitor
        'only screen and (min-width: 769px) and (max-width: 1400px)':
          grid-template-areas: |
            "laggy ellie tp marbs"
            ". selector selector ."
        # Smartphones
        'only screen and (max-width: 768px)':
          grid-template-columns: repeat(2, 1fr)
          grid-template-areas: |
            "laggy ellie"
            "tp marbs"
            "selector selector"
    view_layout:
      grid-area: chonk
    cards:
      - type: custom:mushroom-select-card
        entity: input_select.cat_image_selector
        view_layout:
          grid-area: selector

      - type: picture-entity
        entity: input_select.cat_image_selector
        show_name: false
        show_state: false
        view_layout:
          grid-area: laggy
        state_image:
          "Pixar": /local/img/cats/lagertha-pixar.PNG
          "Ghibli": /local/img/cats/lagertha-ghibli.PNG
          "PetKit": https://img5-us.petkit.cn/uavatar/2019/12/5/5de8716edb2f637de30d1bf73xcJG867z
      - type: picture-entity
        entity: input_select.cat_image_selector
        show_name: false
        show_state: false
        view_layout:
          grid-area: ellie
        state_image:
          "Pixar": /local/img/cats/ellie-pixar.PNG
          "Ghibli": /local/img/cats/ellie-ghibli.PNG
          "PetKit": https://img5-us.petkit.cn/uavatar/2019/12/5/5de8723898953a77f9f5f4acLV5JwbrUs
      - type: picture-entity
        entity: input_select.cat_image_selector
        show_name: false
        show_state: false
        view_layout:
          grid-area: tp
        state_image:
          "Pixar": /local/img/cats/thepunisher-pixar.PNG
          "Ghibli": /local/img/cats/thepunisher-ghibli.PNG
          "PetKit": https://img5-us.petkit.cn/uavatar/2019/12/5/5de86e1d340ebd641143fbcbg75Xh5b7f
      - type: picture-entity
        entity: input_select.cat_image_selector
        show_name: false
        show_state: false
        view_layout:
          grid-area: marbs
        state_image:
          "Pixar": /local/img/cats/marbles-pixar.PNG
          "Ghibli": /local/img/cats/marbles-ghibli.PNG
          "PetKit": https://img5-us.petkit.cn/uavatar/2023/10/20/6531cf2b8b048a000d041b04Xf2cMUw0z
          

  - type: 'custom:button-card'
    template: card_title
    label: Feeders
    view_layout:
      grid-area: feeder-title

  - type: custom:petkit-device
    device_id: db3f2afaa7807e64861e138e222c3fd4
    view_layout:
      grid-area: water1

  - type: custom:petkit-device
    device_id: ae4397233b426e4800920907d87b6a14
    view_layout:
      grid-area: water2

  - type: custom:petkit-device
    device_id: e9197877ed314b17e242e4aec2624ffe
    view_layout:
      grid-area: trail

  - type: custom:petkit-device
    device_id: 5e292fbf1ccd67f04a5468483bba2c76
    view_layout:
      grid-area: noms

  - type: custom:whisker-card
    device_id: 3ac374b8219b337705bfdfb7f1c2348e
    view_layout:
      grid-area: shit1
    cleaning_entity: input_boolean.litter_robots_needs_cleaned
    chonk:
      kities:
        - sensor.ellie_weight
        - sensor.the_punisher_weight
        - sensor.marbles_weight
        - sensor.gnar_weight
        - sensor.murderbot_weight
      hide_names: true
      
  - type: custom:whisker-card
    device_id: 59879713413a5ca5a75f9453eee8e75e
    view_layout:
      grid-area: shit2
    cleaning_entity: input_boolean.litter_robots_needs_cleaned
    chonk:
      kities:
        - sensor.ellie_weight
        - sensor.the_punisher_weight
        - sensor.marbles_weight
        - sensor.gnar_weight
        - sensor.murderbot_weight
      hide_names: true