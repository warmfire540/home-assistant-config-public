title: 'House'
path: 'house'
subview: true
type: custom:grid-layout
layout:
  grid-template-areas: |
    "banner banner banner banner"
    "sensors climate covers alerts"
    "batteries schedules tracking poat-phone"
    "batteries schedules tracking gina-phone"
  mediaquery:
    # portrait monitor
    'only screen and (min-width: 769px) and (max-width: 1400px)':
      grid-template-areas: |
        "banner banner"
        "sensors climate"
        "alerts covers"
        "batteries schedules"
        "tracking ."
        "poat-phone gina-phone"
    # Smartphones
    'only screen and (max-width: 768px)':
      grid-template-areas: |
        "banner"
        "sensors"
        "climate"
        "covers"
        "alerts"
        "batteries"
        "schedules"
        "tracking"
        "poat-phone"
        "gina-phone"
cards:
  #################
  # VACATION MODE BANNER
  #################
  - type: conditional
    conditions:
      - entity: input_boolean.on_vacation
        state: 'on'
    card:
      type: custom:button-card
      view_layout:
        grid-area: banner
      name: '🏖️ VACATION MODE ACTIVE'
      styles:
        card:
          - background-color: 'rgba(255, 193, 7, 0.2)'
          - border: '2px solid #ffc107'
          - border-radius: '10px'
          - padding: '10px'
        name:
          - color: '#ff6b35'
          - font-size: '18px'
          - font-weight: 'bold'
          - text-transform: 'uppercase'
      tap_action:
        action: call-service
        service: input_boolean.toggle
        service_data:
          entity_id: input_boolean.on_vacation

  #################
  # HEADER
  #################
  - type: custom:button-card
    template: mainview_header
    variables:
      area: home
      status_path: 'no'

  #################
  # SENSORS
  #################
  - type: vertical-stack
    view_layout:
      grid-area: sensors
    cards:
      - type: custom:button-card
        template: card_title
        label: Sensors

      - type: custom:advanced-camera-card
        cameras:
          - camera_entity: camera.patio
          - camera_entity: camera.gerbil
          - camera_entity: camera.garage
          - camera_entity: camera.front
          - camera_entity: camera.living_room
        live:
          controls:
            ptz:
              mode: auto
          display:
            mode: grid
            grid_columns: 2
        status_bar:
          style: hover-card

      - type: horizontal-stack
        cards:
          - type: custom:auto-entities
            card:
              type: 'custom:mini-graph-card'
              name: Temperatures
              show:
                legend: false
            filter:
              include:
                - entity_id: 'sensor.*_climate_air_temperature'

          - type: custom:auto-entities
            card:
              type: 'custom:mini-graph-card'
              name: Humidities
              show:
                legend: false
            filter:
              include:
                - entity_id: 'sensor.*_climate_humidity'

      - type: custom:auto-entities
        card:
          type: 'custom:mini-graph-card'
          name: Electricity
          show:
            legend: false
        filter:
          include:
            - entity_id: 'sensor.*_1min'

  #################
  # CLIMATE
  #################
  - type: vertical-stack
    view_layout:
      grid-area: climate
    cards:
      - type: custom:button-card
        template: card_title
        label: Climate

      - type: thermostat
        entity: climate.living_room

      - type: horizontal-stack
        cards:
          - type: 'custom:button-card'
            template: card_generic
            entity: counter.large_air_filters
          - type: 'custom:button-card'
            template: card_generic
            entity: counter.small_air_filters

  - type: vertical-stack
    view_layout:
      grid-area: covers
    cards:
      - type: custom:button-card
        template: card_title
        label: Blinds

      - type: entities
        entities:
          - cover.all_covers

      - type: custom:decluttering-card
        template: cover
        variables:
          - sensor_prefix: living_room
          - show_details: false
          - compact: true
      - type: custom:decluttering-card
        template: cover
        variables:
          - sensor_prefix: dining_room
          - show_details: false
          - compact: true
      - type: custom:decluttering-card
        template: cover
        variables:
          - sensor_prefix: kitchen
          - show_details: false
          - compact: true
      - type: custom:decluttering-card
        template: cover
        variables:
          - sensor_prefix: bedroom
          - show_details: false
          - compact: true
      - type: custom:decluttering-card
        template: cover
        variables:
          - sensor_prefix: office
          - show_details: false
          - compact: true
      - type: custom:decluttering-card
        template: cover
        variables:
          - sensor_prefix: guest_bedroom
          - show_details: false
          - compact: true

  #################
  # ALERTS
  #################
  - type: vertical-stack
    view_layout:
      grid-area: alerts
    cards:
      - type: custom:button-card
        template: card_title
        label: Alerts

      - type: horizontal-stack
        cards:
          - type: 'custom:button-card'
            template: card_input_boolean
            entity: input_boolean.poat_mute
            variables:
              ulm_card_input_boolean_color: red
              ulm_card_input_boolean_force_background_color: true
          - type: 'custom:button-card'
            template: card_input_boolean
            entity: input_boolean.gina_mute
            variables:
              ulm_card_input_boolean_color: red
              ulm_card_input_boolean_force_background_color: true

      - type: custom:auto-entities
        card:
          type: entities
        filter:
          include:
            - domain: alert

  - type: vertical-stack
    view_layout:
      grid-area: batteries
    cards:
      - type: 'custom:anchor-card'
        anchor_id: low-battery
        timeout: 300
        offset: -60

      - type: custom:button-card
        template: card_title
        label: Batteries

      - type: custom:auto-entities
        card:
          type: entities
        filter:
          include:
            - attributes:
                device_class: battery
              options:
                state_color: true
          exclude:
            - domain: binary_sensor
        sort:
          method: state
          numeric: true

  #################
  # SCHEDULES
  #################
  - type: vertical-stack
    view_layout:
      grid-area: schedules
    cards:
      - type: custom:button-card
        template: card_title
        label: Schedules/Shopping

      - type: horizontal-stack
        cards:
          - type: custom:trash-card
            entities:
              - calendar.trash
            layout: vertical
            next_days: 4
            items_per_row: 3
            day_style: counter
            hide_time_range: true
            use_summary: false
            pattern:
              - pattern: trash
                icon: mdi:trash-can
                label: Waste
                color: dark-grey
                type: waste
              - pattern: recycling
                label: Recycling
                icon: mdi:recycle-variant
                color: amber
                type: recycle
              - pattern: yard
                label: Organic
                icon: mdi:flower
                color: light-green
                type: organic

      - type: custom:button-card
        template: card_input_boolean
        entity: input_boolean.on_vacation
        variables:
          ulm_card_input_boolean_name: Vacation Time!

      - type: shopping-list
        title: Shopping List

  #################
  # DEVICE TRACKING
  #################
  - type: vertical-stack
    view_layout:
      grid-area: tracking
    cards:
      - type: custom:button-card
        template: card_title
        label: Device Tracking

      - type: map
        aspect_ratio: 16:9
        auto_fit: true
        entities:
          - device_tracker.house_keys
          - device_tracker.spare_house_key
          - device_tracker.spare_wires
          - device_tracker.ginas_iphone_13_mini
          - device_tracker.poat_s_iphone_14_pro_max
          - device_tracker.poat_s_iphone_14_pro_max_2
          - zone.home

      - type: custom:auto-entities
        card:
          type: entities
        filter:
          include:
            - attributes:
                source_type: gps

  #################
  # PHONES
  #################
  - type: vertical-stack
    view_layout:
      grid-area: poat-phone
    cards:
      - type: custom:button-card
        template: card_title
        label: Phones
      - type: custom:decluttering-card
        template: iphone
        variables:
          - name: Poat
          - phone: poat_s_iphone_14_pro_max

  - type: custom:decluttering-card
    template: iphone
    view_layout:
      grid-area: gina-phone
    variables:
      - name: Gina
      - phone: gina_s_iphone_13_mini
