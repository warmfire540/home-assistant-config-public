---
#####
# House — scan order is alerts, then controls, then status.
#
# Desktop row 1: alerts | climate | blinds | cameras/graphs
# Desktop row 2: batteries | trash/vacation/list | map | phones
#
# Long dumps sit behind a fold. The open list is the relevant slice:
# firing alerts, batteries under 40%. Unfold for idle alerts, chore
# toggles, every battery, GPS names, extra phone sensors.
#####
title: 'House'
path: 'house'
subview: true
type: custom:grid-layout
layout:
  grid-template-areas: |
    "banner banner banner banner"
    "alerts climate covers status"
    "batteries schedules tracking phones"
  mediaquery:
    # portrait monitor
    'only screen and (min-width: 769px) and (max-width: 1400px)':
      grid-template-areas: |
        "banner banner"
        "alerts climate"
        "covers status"
        "batteries schedules"
        "tracking phones"
    # Smartphones
    'only screen and (max-width: 768px)':
      grid-template-areas: |
        "banner"
        "alerts"
        "climate"
        "covers"
        "status"
        "batteries"
        "schedules"
        "tracking"
        "phones"
cards:
  #################
  # VACATION MODE BANNER
  #################
  - type: conditional
    conditions:
      - entity: input_boolean.on_vacation
        state: 'on'
    card:
      type: custom:button-card
      view_layout:
        grid-area: banner
      name: '🏖️ VACATION MODE ACTIVE'
      styles:
        card:
          - background-color: 'rgba(255, 193, 7, 0.2)'
          - border: '2px solid #ffc107'
          - border-radius: '10px'
          - padding: '10px'
        name:
          - color: '#ff6b35'
          - font-size: '18px'
          - font-weight: 'bold'
          - text-transform: 'uppercase'
      tap_action:
        action: call-service
        service: input_boolean.toggle
        service_data:
          entity_id: input_boolean.on_vacation

  #################
  # HEADER
  #################
  - type: custom:button-card
    template: mainview_header
    variables:
      area: home
      status_path: 'no'

  #################
  # STATUS — cameras + house-wide graphs
  #################
  - type: vertical-stack
    view_layout:
      grid-area: status
    cards:
      - type: custom:button-card
        template: card_title
        label: Status

      - type: custom:decluttering-card
        template: frigate_cameras

      - type: horizontal-stack
        cards:
          - type: custom:auto-entities
            card:
              type: 'custom:mini-graph-card'
              name: Temperatures
              show:
                legend: false
            filter:
              include:
                - entity_id: 'sensor.*_climate_air_temperature'

          - type: custom:auto-entities
            card:
              type: 'custom:mini-graph-card'
              name: Humidities
              show:
                legend: false
            filter:
              include:
                - entity_id: 'sensor.*_climate_humidity'

      - type: custom:auto-entities
        card:
          type: 'custom:mini-graph-card'
          name: Electricity
          show:
            legend: false
        filter:
          include:
            - entity_id: 'sensor.*_1min'

  #################
  # CLIMATE
  #################
  - type: vertical-stack
    view_layout:
      grid-area: climate
    cards:
      - type: custom:button-card
        template: card_title
        label: Climate

      - type: thermostat
        entity: climate.living_room

      - type: horizontal-stack
        cards:
          - type: 'custom:button-card'
            template: card_generic
            entity: counter.large_air_filters
          - type: 'custom:button-card'
            template: card_generic
            entity: counter.small_air_filters

  - type: vertical-stack
    view_layout:
      grid-area: covers
    cards:
      - type: custom:button-card
        template: card_title
        label: Blinds

      - type: entities
        entities:
          - cover.all_covers

      - type: custom:decluttering-card
        template: cover
        variables:
          - sensor_prefix: living_room
          - show_details: false
          - compact: true
      - type: custom:decluttering-card
        template: cover
        variables:
          - sensor_prefix: dining_room
          - show_details: false
          - compact: true
      - type: custom:decluttering-card
        template: cover
        variables:
          - sensor_prefix: kitchen
          - show_details: false
          - compact: true
      - type: custom:decluttering-card
        template: cover
        variables:
          - sensor_prefix: bedroom
          - show_details: false
          - compact: true
      - type: custom:decluttering-card
        template: cover
        variables:
          - sensor_prefix: office
          - show_details: false
          - compact: true
      - type: custom:decluttering-card
        template: cover
        variables:
          - sensor_prefix: guest_bedroom
          - show_details: false
          - compact: true

  #################
  # ALERTS
  #################
  - type: vertical-stack
    view_layout:
      grid-area: alerts
    cards:
      - type: custom:button-card
        template: card_title
        label: Alerts

      # Firing first — that is the scan. Mutes are the control under it.
      - type: custom:auto-entities
        show_empty: false
        card:
          type: entities
        else:
          type: markdown
          content: >-
            <ha-alert alert-type="info">Nothing firing</ha-alert>
        filter:
          include:
            - domain: alert
              state: 'on'

      - type: horizontal-stack
        cards:
          - type: 'custom:button-card'
            template: card_input_boolean
            entity: input_boolean.poat_mute
            variables:
              ulm_card_input_boolean_color: red
              ulm_card_input_boolean_force_background_color: true
          - type: 'custom:button-card'
            template: card_input_boolean
            entity: input_boolean.gina_mute
            variables:
              ulm_card_input_boolean_color: red
              ulm_card_input_boolean_force_background_color: true

      # Alerts, then the input_booleans that silence the chore ones
      # (dishwasher, air filters, katchy, litter robots). `need` matches
      # both `_needs_` and `_need_`. Not the mute toggles — those stay
      # above. Turning a chore off is what clears the matching alert.
      - type: custom:auto-entities
        card:
          type: entities
        filter:
          template: >
            {% set alerts = states.alert
               | map(attribute='entity_id') | list %}
            {% set chores = states.input_boolean
               | selectattr('entity_id', 'search', 'need')
               | sort(attribute='name')
               | map(attribute='entity_id') | list %}
            {{ [{
              'type': 'custom:fold-entity-row',
              'open': false,
              'head': {'type': 'section', 'label': 'All alerts'},
              'entities': alerts
                + [{'type': 'section', 'label': 'Clear chores'}]
                + chores
            }] }}

  - type: vertical-stack
    view_layout:
      grid-area: batteries
    cards:
      - type: 'custom:anchor-card'
        anchor_id: low-battery
        timeout: 300
        offset: -60

      - type: custom:button-card
        template: card_title
        label: Batteries

      # Under 40% is the glanceable list. Everything else is one fold
      # away — phones at 80% do not bury a blind at 12%.
      - type: custom:auto-entities
        show_empty: false
        card:
          type: entities
          state_color: true
        else:
          type: markdown
          content: >-
            <ha-alert alert-type="info">All batteries OK</ha-alert>
        filter:
          include:
            - attributes:
                device_class: battery
              state: '< 40'
              options:
                state_color: true
          exclude:
            - domain: binary_sensor
        sort:
          method: state
          numeric: true

      - type: custom:auto-entities
        card:
          type: entities
        filter:
          template: >
            {% set ents = states
               | selectattr('attributes.device_class', 'defined')
               | selectattr('attributes.device_class', 'eq', 'battery')
               | rejectattr('domain', 'eq', 'binary_sensor')
               | sort(attribute='name')
               | map(attribute='entity_id') | list %}
            {{ [{
              'type': 'custom:fold-entity-row',
              'open': false,
              'head': {'type': 'section', 'label': 'All batteries'},
              'entities': ents
            }] }}

  #################
  # SCHEDULES
  #################
  - type: vertical-stack
    view_layout:
      grid-area: schedules
    cards:
      - type: custom:button-card
        template: card_title
        label: Schedules/Shopping

      - type: horizontal-stack
        cards:
          - type: custom:trash-card
            entities:
              - calendar.trash
            layout: vertical
            next_days: 4
            items_per_row: 3
            day_style: counter
            hide_time_range: true
            use_summary: false
            pattern:
              - pattern: trash
                icon: mdi:trash-can
                label: Waste
                color: dark-grey
                type: waste
              - pattern: recycling
                label: Recycling
                icon: mdi:recycle-variant
                color: amber
                type: recycle
              - pattern: yard
                label: Organic
                icon: mdi:flower
                color: light-green
                type: organic

      - type: custom:button-card
        template: card_input_boolean
        entity: input_boolean.on_vacation
        variables:
          ulm_card_input_boolean_name: Vacation Time!

      - type: shopping-list
        title: Shopping List

  #################
  # DEVICE TRACKING
  #################
  - type: vertical-stack
    view_layout:
      grid-area: tracking
    cards:
      - type: custom:button-card
        template: card_title
        label: Device Tracking

      - type: map
        aspect_ratio: 16:9
        auto_fit: true
        entities:
          - device_tracker.house_keys
          - device_tracker.spare_house_key
          - device_tracker.spare_wires
          - device_tracker.ginas_iphone_13_mini
          - device_tracker.poat_s_iphone_14_pro_max
          - device_tracker.poat_s_iphone_14_pro_max_2
          - zone.home

      - type: custom:auto-entities
        card:
          type: entities
        filter:
          template: >
            {% set ents = states.device_tracker
               | selectattr('attributes.source_type', 'defined')
               | selectattr('attributes.source_type', 'eq', 'gps')
               | sort(attribute='name')
               | map(attribute='entity_id') | list %}
            {{ [{
              'type': 'custom:fold-entity-row',
              'open': false,
              'head': {'type': 'section', 'label': 'GPS entities'},
              'entities': ents
            }] }}

  #################
  # PHONES
  #################
  - type: vertical-stack
    view_layout:
      grid-area: phones
    cards:
      - type: custom:button-card
        template: card_title
        label: Phones
      - type: custom:decluttering-card
        template: iphone
        variables:
          - name: Poat
          - phone: poat_s_iphone_14_pro_max
      - type: custom:decluttering-card
        template: iphone
        variables:
          - name: Gina
          - phone: gina_s_iphone_13_mini
