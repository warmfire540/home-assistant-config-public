title: 'Living Room'
path: 'living-room'
subview: true
type: custom:grid-layout
layout:
  grid-template-areas: |
    "header header ."
    "devices vacuum health"
    "sensors . ."
  mediaquery:
    # portrait monitor
    'only screen and (min-width: 769px) and (max-width: 1400px)':
      grid-template-areas: |
        "header header"
        "devices vacuum"
        "health sensors"
    # Smartphones
    'only screen and (max-width: 768px)':
      grid-template-areas: |
        "header"
        "devices"
        "vacuum"
        "sensors"
        "health"
cards:
  #################
  # HEADER
  #################
  - type: custom:button-card
    template: room_header
    view_layout:
      grid-area: header

  #################
  # DEVICES
  #################
  - type: vertical-stack
    view_layout:
      grid-area: devices
    cards:
      - type: 'custom:button-card'
        template: card_title
        label: Devices

      - type: horizontal-stack
        cards:
          - type: 'custom:button-card'
            template: card_light
            entity: light.living_room_light
            variables:
              ulm_card_light_enable_slider: true
              ulm_card_light_enable_collapse: true
          - type: 'custom:button-card'
            template: card_light
            entity: switch.living_room_fan
            variables:
              ulm_card_light_color: blue

      - type: 'custom:button-card'
        template: card_light
        entity: switch.sconce

      - type: custom:decluttering-card
        template: cover
        variables:
          - sensor_prefix: living_room
          - fave_percent: 90

      - type: custom:vacuum-card
        entity: vacuum.joey_essex

      - type: media-control
        entity: media_player.living_room_tv

      - type: 'custom:button-card'
        template: card_thermostat
        entity: climate.living_room
        variables:
          ulm_card_thermostat_enable_collapse: true
          ulm_card_thermostat_enable_controls: true
          ulm_card_thermostat_enable_hvac_modes: true
          ulm_card_thermostat_enable_popup: true
          ulm_card_thermostat_enable_background_color: true

      - type: 'custom:button-card'
        template: card_input_boolean
        entity: input_boolean.katchy_needs_cleaned
        variables:
          ulm_card_input_boolean_color: red
          ulm_card_input_boolean_force_background_color: true

  - type: vertical-stack
    view_layout:
      grid-area: vacuum
    cards:
      - type: custom:device-card
        device_id: 6076b6376fe98f5a6c43622822502fdd

  #################
  # SENSORS
  #################
  - type: vertical-stack
    view_layout:
      grid-area: sensors
    cards:
      - type: 'custom:button-card'
        template: card_title
        label: Sensors

      - type: horizontal-stack
        cards:
          - type: 'custom:button-card'
            template: card_binary_sensor
            variables:
              ulm_card_binary_sensor_alert: true
              ulm_card_binary_sensor_name: Smoke
            entity: binary_sensor.living_room_smoke_sensor_smoke_detected
          - type: 'custom:button-card'
            template: card_binary_sensor
            variables:
              ulm_card_binary_sensor_alert: true
              ulm_card_binary_sensor_name: Carbon Monoxide
            entity: binary_sensor.living_room_smoke_sensor_carbon_monoxide_detected

      - type: 'custom:button-card'
        template: card_input_boolean
        entity: input_boolean.air_filters_need_changed
        variables:
          ulm_card_input_boolean_force_background_color: true
          ulm_card_input_boolean_color: red

      - type: custom:area-energy-card
        area: living_room
        features:
          - hide_name
        chart:
          axis_style: none
          line_type: gradient_no_fill


  #################
  # DEVICE HEALTH
  #################
  - type: vertical-stack
    view_layout:
      grid-area: health
    cards:
      - type: 'custom:button-card'
        template: card_title
        label: Device Health

      - type: custom:advanced-camera-card
        cameras:
          - camera_entity: camera.living_room

      - type: custom:zwave-device-center
        area: living_room

      - type: custom:decluttering-card
        template: eero
        variables:
          - location: living_room
