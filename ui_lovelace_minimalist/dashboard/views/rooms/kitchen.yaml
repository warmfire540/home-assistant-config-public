title: 'Kitchen'
path: 'kitchen'
subview: true
type: custom:grid-layout
layout:
  grid-template-areas: |
    "header header ."
    "devices sensors health"
  mediaquery:
    # portrait monitor
    'only screen and (min-width: 769px) and (max-width: 1400px)':
      grid-template-areas: |
        "header header"
        "devices sensors"
        "health ."
    # Smartphones
    'only screen and (max-width: 768px)':
      grid-template-areas: |
        "header"
        "devices"
        "sensors"
        "health"
cards:
  #################
  # HEADER
  #################
  - type: custom:button-card
    template: room_header
    view_layout:
      grid-area: header

  #################
  # DEVICES
  #################
  - type: vertical-stack
    view_layout:
      grid-area: devices
    cards:
      - type: 'custom:button-card'
        template: card_title
        label: Devices

      - type: 'custom:button-card'
        template: card_light
        entity: light.kitchen_light

      - type: 'custom:button-card'
        template: card_light
        entity: switch.under_cabinet_lights

      - type: horizontal-stack
        cards:
          - type: 'custom:button-card'
            template: card_light
            entity: light.dinette_light
            variables:
              ulm_card_light_enable_slider: true
              ulm_card_light_enable_collapse: true
          - type: 'custom:button-card'
            template: card_light
            entity: switch.kitchen_fan
            variables:
              ulm_card_light_color: blue

      - type: custom:decluttering-card
        template: cover
        variables:
          - sensor_prefix: kitchen

      - type: custom:device-card
        device_id: 75376456755137575411dd1b1c39567f

      - type: custom:device-card
        device_id: b77b9ded2d2433042874ccff80ce74b7

  #################
  # SENSORS
  #################
  - type: vertical-stack
    view_layout:
      grid-area: sensors
    cards:
      - type: 'custom:button-card'
        template: card_title
        label: Sensors

      - type: 'custom:button-card'
        template: card_input_boolean
        entity: input_boolean.dishwasher_needs_cleaned
        variables:
          ulm_card_input_boolean_force_background_color: true
          ulm_card_input_boolean_color: red

      - type: custom:area-energy-card
        area: kitchen
        features:
          - hide_name
        chart:
          axis_style: none
          line_type: gradient_no_fill

  #################
  # DEVICE HEALTH
  #################
  - type: vertical-stack
    view_layout:
      grid-area: health
    cards:
      - type: 'custom:button-card'
        template: card_title
        label: Device Health

      - type: custom:zwave-device-center
        area: kitchen

      - type: custom:decluttering-card
        template: leak_sensors
        variables:
          - sensor_prefix: dishwasher
