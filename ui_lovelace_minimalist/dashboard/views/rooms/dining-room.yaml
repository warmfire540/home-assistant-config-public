title: 'Dining Room'
path: 'dining-room'
subview: true
type: custom:grid-layout
layout:
  grid-template-areas: |
    "header header ."
    "devices sensors health"
  mediaquery:
    # portrait monitor
    'only screen and (min-width: 769px) and (max-width: 1400px)':
      grid-template-areas: |
        "header header"
        "devices sensors"
        "health ."
    # Smartphones
    'only screen and (max-width: 768px)':
      grid-template-areas: |
        "header"
        "devices"
        "sensors"
        "health"
cards:
  #################
  # HEADER
  #################
  - type: custom:button-card
    template: room_header
    view_layout:
      grid-area: header

  #################
  # DEVICES
  #################
  - type: vertical-stack
    view_layout:
      grid-area: devices
    cards:
      - type: 'custom:button-card'
        template: card_title
        label: Devices

      - type: horizontal-stack
        cards:
          - type: 'custom:button-card'
            template: card_light
            entity: light.dining_room_light
            variables:
              ulm_card_light_enable_slider: true
              ulm_card_light_enable_collapse: true
          - type: 'custom:button-card'
            template: card_light
            entity: switch.dining_room_fan
            variables:
              ulm_card_light_color: blue

      - type: custom:decluttering-card
        template: cover
        variables:
          - sensor_prefix: dining_room

      - type: 'custom:button-card'
        template: card_input_boolean
        entity: input_boolean.katchy_needs_cleaned
        variables:
          ulm_card_input_boolean_color: red
          ulm_card_input_boolean_force_background_color: true

      - type: custom:device-card
        device_id: 543bb059f4db559c3d1a9b63dbf9d6c6

  #################
  # SENSORS
  #################
  - type: vertical-stack
    view_layout:
      grid-area: sensors
    cards:
      - type: 'custom:button-card'
        template: card_title
        label: Sensors

      - type: 'custom:button-card'
        template: card_graph
        entity: sensor.dining_micro_12_1min
        variables:
          ulm_card_graph_color: 'var(--google-yellow)'
          ulm_card_graph_entity: sensor.dining_micro_12_1min
          ulm_card_graph_name: Dining Micro

  #################
  # DEVICE HEALTH
  #################
  - type: vertical-stack
    view_layout:
      grid-area: health
    cards:
      - type: 'custom:button-card'
        template: card_title
        label: Device Health

      - type: custom:zwave-device-center
        area: dining_room
