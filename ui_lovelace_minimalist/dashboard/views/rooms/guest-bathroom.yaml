title: Guest Bathroom
path: guest-bath
subview: true
type: custom:grid-layout
layout:
  grid-template-areas: |
    "header header"
    "sensors health"
  mediaquery:
    # portrait monitor
    'only screen and (min-width: 769px) and (max-width: 1400px)':
      grid-template-areas: |
        "header header"
        "sensors health"
    # Smartphones
    'only screen and (max-width: 768px)':
      grid-template-areas: |
        "header"
        "sensors"
        "health"
cards:
  #################
  # HEADER
  #################
  - type: custom:button-card
    template: room_header
    view_layout:
      grid-area: header

  #################
  # SENSORS
  #################
  - type: vertical-stack
    view_layout:
      grid-area: sensors
    cards:
      - type: 'custom:button-card'
        template: card_title
        label: Sensors

      - type: custom:area-energy-card
        area: guest_bath
        entities:
          - sensor.office_g_bath_garage_3_1min
        features:
          - hide_name
        chart:
          axis_style: none
          line_type: gradient_no_fill

      - type: 'custom:button-card'
        template: card_input_boolean
        entity: binary_sensor.air_filter_door_sensor_open
        variables:
          ulm_card_input_boolean_force_background_color: true
          ulm_card_input_boolean_name: Air Filter Door

  #################
  # DEVICE HEALTH
  #################
  - type: vertical-stack
    view_layout:
      grid-area: health
    cards:
      - type: 'custom:button-card'
        template: card_title
        label: Device Health

      - type: custom:zwave-device-center
        area: guest_bath
