---
#####
# Office — the everyday room view. Follows the room standard in
# rooms/README.md: status chips + climate graphs, then Lights, Media,
# Camera, then a link to the details subview. Native cards except the
# status chips, so nothing else depends on a ULM template or HACS card.
#
# Anything that is not a daily control lives on `office-details`
# (rooms/office-details.yaml): every device in the area, Frigate
# clips/PTZ, the Xbox remote, energy.
#
# Blinds favorite (20%) is stored on the entity, not here: hold a
# favorite in the blinds more-info dialog to change it, and the tile
# picks it up.
#####
title: Office
path: office
subview: true
back_path: /the-matrix/home
type: sections
max_columns: 3

sections:
  #################
  # STATUS — area chips + climate graphs
  #################
  # toolbar-status-chips picks the area from the URL (`office`) and
  # shows that area's entities labelled `status` — door, smoke, CO,
  # cat at the gerbils. Labels are set in Settings, not here; that is
  # why this view has no badges. It positions itself at the top of the
  # page, but still claims a grid slot — full width with auto rows
  # keeps it from pushing the climate tiles over.
  #
  # One column wide like the others: spanning the view stretched the
  # climate graphs edge to edge on a monitor.
  - type: grid
    cards:
      - type: custom:toolbar-status-chips
        grid_options:
          columns: full
          rows: auto
      # Mushroom chips: the smallest clickable option. Tiles were as big
      # as the controls, glance was taller still, and heading badges pin
      # to the far right with a wide gap on desktop. Template chips
      # because a plain entity chip cannot colour by state.
      - type: heading
        heading: Occupancy
        heading_style: subtitle
        icon: mdi:motion-sensor
      - type: custom:mushroom-chips-card
        grid_options:
          columns: full
          rows: auto
        chips:
          - type: template
            entity: binary_sensor.gerbil_person_occupancy
            icon: mdi:account
            icon_color: >-
              {{ 'green' if is_state(entity, 'on') else 'disabled' }}
            content: Person
            tap_action:
              action: more-info
          - type: template
            entity: binary_sensor.gerbil_cat_occupancy
            icon: mdi:cat
            icon_color: >-
              {{ 'orange' if is_state(entity, 'on') else 'disabled' }}
            content: Cat
            tap_action:
              action: more-info
          - type: template
            entity: binary_sensor.gerbil_rodent_occupancy
            icon: mdi:rodent
            icon_color: >-
              {{ 'amber' if is_state(entity, 'on') else 'disabled' }}
            content: Gerbils
            tap_action:
              action: more-info
      - type: heading
        heading: Climate
        heading_style: subtitle
        icon: mdi:thermometer
      # A nested 2-up grid, not `columns: 6` per tile: a section's grid
      # column count grows with its column_span, so 6 is only half in a
      # one-column section.
      - type: grid
        columns: 2
        square: false
        grid_options:
          columns: full
          rows: auto
        cards:
          - type: tile
            entity: sensor.office_climate_air_temperature
            name: Temperature
            color: red
            features:
              - type: trend-graph
                hours_to_show: 24
          - type: tile
            entity: sensor.office_climate_humidity
            name: Humidity
            color: blue
            features:
              - type: trend-graph
                hours_to_show: 24

      #################
      # MEDIA — same section as status on purpose
      #################
      # Sections lay out in rows, so the next row starts below the
      # tallest section. Status + media, lights & blinds, and the camera
      # come out within ~70px of each other on a monitor; a separate
      # media section pushed the camera onto a second row with a gap.
      - type: heading
        heading: Media
        heading_style: subtitle
        icon: mdi:television
      # media-control, not a tile: it shows the app/artwork, which is
      # what makes the TV recognisable at a glance.
      - type: media-control
        entity: media_player.office_tv
        grid_options:
          columns: full
          rows: auto
      - type: tile
        entity: media_player.xbox_x
        name: Xbox
        grid_options:
          columns: full
      # Hidden while unavailable (it is usually unplugged) rather than
      # showing a warning badge.
      - type: tile
        entity: media_player.xbox_360
        name: Xbox 360
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: media_player.xbox_360
            state_not: unavailable

  #################
  # LIGHTS & BLINDS — tap toggles, hold for more-info
  #################
  - type: grid
    cards:
      - type: heading
        heading: Lights & blinds
        heading_style: subtitle
        icon: mdi:lightbulb-group
      - type: tile
        entity: light.office_light
        name: Light
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        features:
          - type: light-brightness
        grid_options:
          columns: full
      - type: tile
        entity: switch.office_fan
        name: Fan
        icon: mdi:ceiling-fan
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        grid_options:
          columns: full
      # Battery ring top-right, like the old ULM `battery_info`: a tile
      # cannot show a second entity, so card-mod draws it as ::after.
      # The ring is a conic-gradient (the level) under a radial-gradient
      # (the hole), so no SVG and no mask that would also hide the text.
      - type: tile
        entity: cover.office_blinds
        name: Blinds
        features:
          - type: cover-open-close
          - type: cover-position-favorite
          - type: cover-position
        grid_options:
          columns: full
        card_mod:
          style: |
            {% set b = states('sensor.office_blinds_battery') | int(0) %}
            {% set c = 'var(--red-color)' if b <= 15
                 else 'var(--orange-color)' if b <= 30
                 else 'var(--green-color)' %}
            ha-card { position: relative; }
            ha-card::after {
              content: "{{ b }}%";
              position: absolute;
              top: 10px;
              right: 10px;
              width: 30px;
              height: 30px;
              border-radius: 50%;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 9px;
              font-weight: 700;
              color: var(--primary-text-color);
              background:
                radial-gradient(closest-side,
                  var(--ha-card-background, var(--card-background-color)) 82%,
                  transparent 84%),
                conic-gradient({{ c }} {{ b }}%, var(--divider-color) 0);
              pointer-events: none;
            }

  #################
  # CAMERA — snapshot refresh, not a live stream; tap for live
  #################
  - type: grid
    cards:
      - type: heading
        heading: Gerbils
        heading_style: subtitle
        icon: mdi:cctv
      - type: picture-entity
        entity: camera.gerbil
        camera_view: auto
        show_name: false
        show_state: false
        grid_options:
          columns: full

  #################
  # MORE — everything else is one tap away
  #################
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading: All devices & details
        heading_style: subtitle
        icon: mdi:devices
        tap_action:
          action: navigate
          navigation_path: /the-matrix/office-details
      # Closet is its own area but lives in the office — same path the
      # Home server-closet tile uses (Uptime; Pi-hole / Z-Wave are tabs).
      - type: heading
        heading: Server closet
        heading_style: subtitle
        icon: mdi:server
        tap_action:
          action: navigate
          navigation_path: /home-lab/uptime
