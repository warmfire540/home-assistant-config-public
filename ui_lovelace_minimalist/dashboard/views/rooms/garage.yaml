title: Garage
path: garage
subview: true
type: custom:grid-layout
layout:
  grid-template-areas: |
    "header header ."
    "devices sensors health"
  mediaquery:
    # portrait monitor
    'only screen and (min-width: 769px) and (max-width: 1400px)':
      grid-template-areas: |
        "header header"
        "devices sensors"
        "health ."
    # Smartphones
    'only screen and (max-width: 768px)':
      grid-template-areas: |
        "header"
        "devices"
        "sensors"
        "health"
cards:
  #################
  # HEADER
  #################
  - type: custom:button-card
    template: room_header
    view_layout:
      grid-area: header

  #################
  # DEVICES
  #################
  - type: vertical-stack
    view_layout:
      grid-area: devices
    cards:
      - type: custom:button-card
        template: card_title
        label: Devices

      - type: custom:button-card
        template: card_binary_sensor_alert
        entity: binary_sensor.garage_door_tilt_window_door_is_open
        variables:
          ulm_card_binary_sensor_alert_name: Garage Door
        tap_action:
          action: call-service
          service: switch.toggle
          service_data:
            entity_id: switch.garage_opener

      - type: custom:button-card
        template: card_light
        entity: switch.garage_opener_plug
        variables:
          ulm_card_light_name: Garage Door Power
          ulm_card_light_color: green

      - type: custom:device-card
        device_id: 8fcd19d3e572dcb5a1ebf69380615300

  #################
  # SENSORS
  #################
  - type: vertical-stack
    view_layout:
      grid-area: sensors
    cards:
      - type: custom:button-card
        template: card_title
        label: sensor
        
      - type: custom:area-energy-card
        area: garage
        features:
          - hide_name
        chart:
          axis_style: none
          line_type: gradient_no_fill

  #################
  # DEVICE HEALTH
  #################
  - type: vertical-stack
    view_layout:
      grid-area: health
    cards:
      - type: custom:button-card
        template: card_title
        label: Device Health

      - type: custom:zwave-device-center
        area: garage

      - type: custom:decluttering-card
        template: leak_sensors
        variables:
          - sensor_prefix: water_heater

      - type: custom:decluttering-card
        template: eero
        variables:
          - location: garage
