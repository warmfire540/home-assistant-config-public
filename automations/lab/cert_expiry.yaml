---
#####
# Certificate expiry — alert, and all-clear
#
# The whole point of the NPM build is that every service in the house is
# reached over TLS. This is the automation that tells you when that is about
# to stop being true, and it exists because the failure is otherwise SILENT:
# certbot renews unattended over DNS-01, so a broken renewal produces no error
# anywhere until the certificate actually lapses and everything goes red at
# once.
#
# WHY THE THRESHOLD IS 21 DAYS
#
# Let's Encrypt issues for 90 days; certbot attempts renewal at 30 days
# remaining and retries twice daily after that. So:
#
#   > 30 days   healthy, nothing has even been attempted yet
#   30 -> 22    renewal is failing, but retries are still cheap and quiet
#   21 days     roughly EIGHTEEN failed attempts. This is not a blip.
#   0 days      every hostname in the lab throws a browser warning
#
# Alerting at 30 would fire on the first transient DNS hiccup and teach you to
# ignore it. Alerting at 7 leaves no room to debug a Cloudflare token or an
# NPM upgrade over a weekend. 21 is late enough to be certain and early enough
# to be calm, which is the only pair of properties that matters.
#
# WHY THERE ARE TWO TRIGGERS AND NOT ONE
#
# The countdown and the handshake are different failures with different
# causes, and the second can happen at full remaining validity:
#
#   numeric threshold  the cert is real but renewal has stopped working
#   is_valid false     the TLS handshake fails RIGHT NOW — NPM is down, the
#                      Pi-hole wildcard is gone, or the cert is wrong for the
#                      name. Days remaining is irrelevant and may read 60.
#
# A single numeric trigger would miss the second case entirely, which is the
# more urgent of the two.
#
# ⚠️ THIS DELIBERATELY DOES NOT DUPLICATE UPTIME KUMA. Kuma's
# `NPM - proxy chain` monitor has Certificate Expiry Notification enabled and
# covers the same ground from outside HA — on purpose, because Kuma is what
# tells you when HA itself is down. The overlap is the point, not an
# oversight: these are the two independent paths, and neither is trusted to
# report its own death.
#
# `for:` is the flap guard, and it also rides out a Home Assistant restart —
# the rollup is unavailable while templates reload, and without the delay a
# routine restart would page you. Learned the hard way on 2026-08-14, when a
# stale template listener after an integration reconfigure made every rollup
# on the board read zero.
#
# Backing sensor: entities/templates/cert_expiry.yaml
# Setup + the DNS-01 flow: **servers** repo, hosts/jack-sparrow/npm-runbook.md
#####

alias: Lab - certificate expiring or invalid
id: lab_cert_expiry
description: >
  Alerts when the wildcard certificate is inside 21 days of expiry, or when
  the TLS handshake to a proxied host fails outright. Both are silent
  otherwise.
mode: single

triggers:
  # The slow one: renewal has stopped working.
  - trigger: numeric_state
    entity_id: sensor.lab_certificate_expiry
    below: 21
    for: "00:10:00"
    id: expiring

  # The fast one: TLS is broken right now, whatever the clock says.
  - trigger: numeric_state
    entity_id: sensor.lab_certificate_expiry
    attribute: invalid_count
    above: 0
    for: "00:10:00"
    id: invalid

  # All-clear. Fires when the count returns to zero AND there is comfortable
  # runway again, so a renewal that succeeds closes the loop without anyone
  # having to go and look.
  - trigger: numeric_state
    entity_id: sensor.lab_certificate_expiry
    above: 30
    for: "00:10:00"
    id: recovered

conditions:
  # An unavailable rollup is not an emergency, it is a reload. Without this,
  # every HA restart and every `Reload Template Entities` sends a push.
  - condition: not
    conditions:
      - condition: state
        entity_id: sensor.lab_certificate_expiry
        state:
          - unknown
          - unavailable

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: invalid
        sequence:
          - action: notify.persistent_notification
            data:
              title: "🔴 TLS handshake failing"
              message: >-
                {{ state_attr('sensor.lab_certificate_expiry', 'invalid') }}

                Days remaining reads
                {{ states('sensor.lab_certificate_expiry') }}, so this is
                probably NOT the certificate — check NPM is running
                (http://192.168.5.8:81) and that the Pi-hole wildcard still
                resolves.

      - conditions:
          - condition: trigger
            id: expiring
        sequence:
          - action: notify.persistent_notification
            data:
              title: "⚠️ Certificate expires in {{ states('sensor.lab_certificate_expiry') }} days"
              message: >-
                {{ state_attr('sensor.lab_certificate_expiry', 'soonest') }}

                Let's Encrypt retries from 30 days out, so renewal has already
                failed many times. Check the Cloudflare API token has not been
                revoked, and NPM's logs on jack-sparrow:

                  sudo docker compose logs npm | grep -i certbot

      - conditions:
          - condition: trigger
            id: recovered
        sequence:
          - action: notify.persistent_notification
            data:
              title: "✅ Certificate renewed"
              message: >-
                {{ states('sensor.lab_certificate_expiry') }} days remaining
                on {{ state_attr('sensor.lab_certificate_expiry', 'soonest') }}.
