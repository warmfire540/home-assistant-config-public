#####
# Alert when the hottest drive runs sustained-hot
#
# Celsius — Scrutiny reports °C. The UGREEN integration reports the CPU in °F,
# so do not copy thresholds between this and the NAS view.
#
# 50 °C for an hour, not an instant spike. Four helium spinners sharing one
# intake will touch high numbers during a parity sync, a scrub, or the initial
# burn-in, and that is expected. Sustained is the signal: BackBlaze's data puts
# the AFR climb above roughly 45 °C, and anything holding 50 °C is a cooling
# problem (fan mode, dust, ambient) rather than a failing drive.
#
# The `hottest_drive` attribute names which one, which matters — a single hot
# bay is airflow or a dying drive, all six hot is the room or the fan curve.
#####

alias: Scrutiny drive temperature alert
id: e1d29338-04a2-4222-a6a0-01389f0da1e8

trigger:
  trigger: numeric_state
  entity_id: sensor.scrutiny_max_drive_temperature
  above: 50
  for:
    hours: 1

action:
  - action: notify.persistent_notification
    data:
      title: '🌡️ Drive Temperature High'
      message: >-
        {{ state_attr('sensor.scrutiny_max_drive_temperature', 'hottest_drive') }}
        has held {{ states('sensor.scrutiny_max_drive_temperature') }}°C for an
        hour. If only one bay is hot it is airflow or the drive; if all six are,
        check fan mode and ambient.
  - action: notify.mobile_app_poat_s_iphone_14_pro_max
    data:
      title: '🌡️ Drive Temperature High'
      message: >-
        {{ state_attr('sensor.scrutiny_max_drive_temperature', 'hottest_drive') }}
        at {{ states('sensor.scrutiny_max_drive_temperature') }}°C, sustained.
      data:
        tag: scrutiny_drive_temp
        url: /jack-sparrow/drives
