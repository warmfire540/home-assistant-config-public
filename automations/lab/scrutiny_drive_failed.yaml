#####
# Alert when Scrutiny marks any drive as failed
#
# Rolled up in entities/templates/scrutiny.yaml — the state goes Problem when
# any drive's Overall Status is not "Passed", either because the drive's own
# SMART assessment failed or because Scrutiny's BackBlaze-derived thresholds
# tripped. The `problems` attribute names which drive.
#
# `for: 10 minutes` rides out a Home Assistant restart. The rollup sensor is
# unavailable while the integration reloads, and without the delay a routine
# restart would page you. A real failure does not clear itself in ten minutes.
#
# Context worth keeping in the message: jack-sparrow is RAID 5, one drive of
# parity. One failed drive is a scheduled replacement. Two is a lost array.
#####

alias: Scrutiny drive failed alert
id: f17ffdd1-1d7f-44c0-877f-64c530d1e889

trigger:
  trigger: state
  entity_id: sensor.scrutiny_drive_health
  to: 'Problem'
  for:
    minutes: 10

action:
  - action: notify.persistent_notification
    data:
      title: '💽 Drive Health Alert!'
      message: >-
        {{ state_attr('sensor.scrutiny_drive_health', 'problems') }}.
        jack-sparrow is RAID 5 — one drive of parity. Replace before the
        next scrub.
  - action: notify.mobile_app_poat_s_iphone_14_pro_max
    data:
      title: '💽 Drive Health Alert!'
      message: >-
        {{ state_attr('sensor.scrutiny_drive_health', 'problems') }}.
        RAID 5 — one drive of parity left.
      data:
        tag: scrutiny_drive_health
        push:
          sound:
            name: 'default'
            critical: 1
            volume: 1.0
