#####
# Kitchen scene remote.
#
# Bulbs 1–4, the light.kitchen_bulbs group, and the color scenes
# (daylight / bright / warm / fun) were removed with those bulbs.
# The fourth scene button still toggles the sconce.
#####

alias: Change Kitchen Scenes
id: 3e97bd1e-4e42-4f5c-87ba-34bd2be0fc3a

trigger:
  - alias: Scene Four button pressed
    trigger: state
    entity_id: event.kitchen_light_scene_004
    id: scene-four

action:
  - alias: Toggle the sconce
    action: switch.toggle
    target:
      entity_id: switch.sconce

mode: parallel
