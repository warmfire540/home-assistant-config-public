#####
# Creates an alert from sensor state changes
# Generic automation for when sensors switch to "on" state
# Supports optional alert_threshold_minutes to prevent repeat alerts
# Uses counter helpers for persistent cooldown tracking
#####

alias: Create alert from sensor state change
id: 92445b68-5feb-4aae-9d0a-1396bf8f7bd6

variables:
  # Extract the threshold from the triggered entity's attributes
  threshold_minutes: "{{ state_attr(trigger.entity_id, 'alert_threshold_minutes') }}"
  # Create the counter entity name for this sensor
  counter_entity: "counter.alert_cooldown_{{ trigger.entity_id | replace('.', '_') | replace('-', '_') }}"
  # Escalate to critical when shed opens late at night (12am–6am)
  is_critical: >-
    {{ trigger.entity_id == 'binary_sensor.shed_door_sensor_window_door_is_open'
       and (now().hour >= 0 or now().hour < 6) }}

trigger:
  - trigger: state
    entity_id:
      # Add sensor entities here that should trigger notifications when they turn "on"
      # - binary_sensor.queso_gerbil_motion_detected
      # - binary_sensor.guava_gerbil_motion_detected
      # - binary_sensor.espresso_or_bean_gerbil_motion_detected
      - binary_sensor.shed_door_sensor_window_door_is_open
      - binary_sensor.office_door_window_door_is_open
    to: 'on'

  - trigger: state
    entity_id:
      # Add sensor entities here that should trigger notifications when they turn "on"
      - switch.water_valve
    to: 'off'

condition:
  # Only proceed if no threshold is set, or if enough time has passed since last alert
  - condition: template
    value_template: >-
      {% if threshold_minutes %}
        {% set counter_state = states(counter_entity) %}
        {% if counter_state in ['unknown', 'unavailable'] or counter_state == '0' %}
          true
        {% else %}
          {% set last_changed = states[counter_entity].last_changed %}
          {% set time_diff = (now() - last_changed).total_seconds() / 60 %}
          {{ time_diff >= (threshold_minutes | float) }}
        {% endif %}
      {% else %}
        true
      {% endif %}

action:
  # Update the counter to mark this alert time (if threshold is configured)
  - if:
      - condition: template
        value_template: '{{ threshold_minutes is not none }}'
    then:
      - action: counter.reset
        target:
          entity_id: '{{ counter_entity }}'
      - action: counter.increment
        target:
          entity_id: '{{ counter_entity }}'

  # Send the notification
  - action: notify.family_ai
    data:
      title: '{{ trigger.to_state.attributes.friendly_name or trigger.entity_id }} alert'
      message: false
      data:
        prompt: >-
          The {{ trigger.to_state.attributes.friendly_name or trigger.entity_id }} sensor 
          has changed from {{ trigger.from_state.state }} to {{ trigger.to_state.state }}.
          {% if trigger.to_state.attributes.device_class %}
            This is a {{ trigger.to_state.attributes.device_class }} sensor.
          {% endif %}
          {% if trigger.to_state.attributes.battery_level %}
            The sensor battery level is {{ trigger.to_state.attributes.battery_level }}%.
          {% endif %}
          {% if threshold_minutes %}
            (Alert cooldown: {{ threshold_minutes }} minutes)
          {% endif %}
        backup: '{{ trigger.to_state.attributes.friendly_name or trigger.entity_id }} is now {{ trigger.to_state.state }}!'
        tag: 'sensor_{{ trigger.entity_id | replace(".", "_") }}'
        push:
          sound:
            name: default
            critical: '{{ 1 if is_critical else 0 }}'
            volume: 1.0
