#####
# Configures the lovelace dashboards via YAML
#
#####

lovelace:
  mode: storage
  # Add yaml dashboards
  dashboards:
    the-matrix:
      mode: yaml
      title: Matrix
      icon: mdi:home
      show_in_sidebar: true
      filename: ui_lovelace_minimalist/dashboard/home-dashboard.yaml

    # jack-sparrow (UGREEN NASync DXP4800 Pro)
    # Standalone: needs its own button_card_templates: block for the
    # ugreen_nas_template, which can't live in UML's HACS-managed template dir.
    # The entry file is a stub; templates and views are !include'd from the
    # sibling dashboards/jack-sparrow/ directory.
    jack-sparrow:
      mode: yaml
      title: jack-sparrow
      icon: mdi:pirate
      show_in_sidebar: true
      filename: dashboards/jack-sparrow.yaml

    # room-summary-card
    rsc-background-image-test:
      mode: yaml
      title: Room Summary Card - Background Image Test
      icon: mdi:image-multiple
      show_in_sidebar: false
      filename: dashboards/room-summary-card/background-image-test.yaml

    rsc-background-opacity-test:
      mode: yaml
      title: Room Summary Card - Background Opacity Test
      icon: mdi:opacity
      show_in_sidebar: false
      filename: dashboards/room-summary-card/background-opacity-test.yaml

    rsc-action-handling-test:
      mode: yaml
      title: Room Summary Card -  Action Handling
      icon: mdi:gesture-tap
      show_in_sidebar: false
      filename: dashboards/room-summary-card/action-handling-test.yaml

    rsc-entity-wrap-test:
      mode: yaml
      title: Room Summary Card - Entity Wrap Test
      icon: mdi:wrap
      show_in_sidebar: false
      filename: dashboards/room-summary-card/entity-wrap-test.yaml

    rsc-card-border-test:
      mode: yaml
      title: Room Summary Card - Card Border Test
      icon: mdi:border-color
      show_in_sidebar: false
      filename: dashboards/room-summary-card/card-border-test.yaml
