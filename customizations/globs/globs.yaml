#####
# Add an entry for each glob pattern that you want to overwrite.
#
# https://www.home-assistant.io/integrations/homeassistant/#manual-customization
#####

# counters
'counter.homeassistant_*':
  navigation_path: /config/logs

# binary sensors
'binary_sensor.poat_*_local':
  on_state: 'off'

'binary_sensor.*_water_level':
  navigation_path: /the-matrix/cats

# sensors
'sensor.*_battery_level':
  device_class: battery

'sensor.*_air_temperature':
  friendly_name: Temperature

'sensor.*_desiccant_left_days':
  navigation_path: /the-matrix/cats
  numeric_state_pass_threshold: 10
  numeric_state_warning_threshold: 5

'sensor.*_filter_remaining':
  navigation_path: /the-matrix/cats
  numeric_state_pass_threshold: 30
  numeric_state_warning_threshold: 10